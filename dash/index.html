<html lang="pt-BR" data-screen-label="aperIA Dashboard">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aperIA · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    fontFamily: { sans: ['"Open Sans"','"Helvetica Neue"','Arial','sans-serif'], mono: ['"JetBrains Mono"','ui-monospace','monospace'] },
    extend: {
      colors: {
        ink:      {50:'var(--text-primary)',100:'var(--text-hi)',200:'var(--text-secondary)',300:'var(--text-dim)',400:'var(--text-dim)',500:'var(--border-default)',600:'var(--bg-surface-raised)',700:'var(--bg-surface)',800:'var(--bg-surface)',900:'var(--bg-page)'},
        crimson:  {50:'#fff1f1',100:'#ffd7d7',200:'#ffa3a3',300:'#ff6b6b',400:'#ef3a3a',500:'#d81f2a',600:'#b81620',700:'#8d0e16',800:'#5a070d',900:'#2b0306'},
        severity: {critical:'#ff2d3d',high:'#ff6a3d',medium:'#f5a524',low:'#f5d524',info:'#4aa3ff',safe:'#2ecc8b'},
        surface:  {DEFAULT:'var(--bg-surface)',1:'var(--bg-surface)',2:'var(--bg-surface-raised)',deep:'var(--bg-page)'},
        fg:       {DEFAULT:'var(--text-primary)',mute:'var(--text-secondary)',dim:'var(--text-dim)'},
        line:     {DEFAULT:'var(--border-default)',strong:'var(--border-strong)'},
        brand:    {DEFAULT:'#d81f2a',hov:'#b81620'},
      },
      borderRadius: {xs:'3px',sm:'6px',md:'10px',lg:'12px',xl:'14px'},
      transitionDuration: {fast:'140ms',base:'220ms'},
      boxShadow: {
        'el-1':'0 1px 0 var(--veil-03) inset,0 1px 2px rgba(0,0,0,.5)',
        'el-2':'0 1px 0 var(--veil-04) inset,0 8px 24px -10px rgba(0,0,0,.7)',
        'el-3':'0 1px 0 var(--veil-05) inset,0 24px 48px -18px rgba(0,0,0,.85)',
        'glow-red':'0 0 0 1px rgba(216,31,42,.4),0 0 32px -4px rgba(216,31,42,.45)',
        'ring-focus':'0 0 0 2px #d81f2a,0 0 0 4px rgba(216,31,42,.25)',
      },
    },
  },
};
</script>
<script>
(function(){try{var t=localStorage.getItem('aperia-theme');if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
function toggleTheme(){var el=document.documentElement;var isLight=el.getAttribute('data-theme')==='light';if(isLight){el.removeAttribute('data-theme');}else{el.setAttribute('data-theme','light');}try{localStorage.setItem('aperia-theme',isLight?'dark':'light');}catch(e){}var b=document.getElementById('theme-toggle');if(b)b.setAttribute('aria-label',isLight?'Ativar tema claro':'Ativar tema escuro');}
</script>
<style>
/* ═══ Design tokens — dark values (baseline, unchanged) ═══ */
:root{
--bg-page:#0c0d0f;--bg-surface:#17181a;--bg-surface-raised:#1f2023;--bg-hover:#26272a;
--border-subtle:#1f2023;--border-default:#202124;--divider:#2e2f31;--border-mid:#3a3b3d;--border-strong:#4a4b4d;
--text-primary:#f2f2f2;--text-hi:#d0d0d0;--text-secondary:#a1a1a1;--text-muted:#8a8a8a;--text-dim:#707070;--text-faint:#5c5c5c;
--gauge-track:#26272a;--chart-track:#1a1a1a;--chart-grid:#1e1e1e;
--card-inner:#0d0d0d;--tb-card-bg:#222;--chip-bg:#141414;--chip-hover:#191111;--card-dots:rgba(255,255,255,.035);--th-bg:#0c0d0f;
--veil-t88:rgba(255,255,255,.88);--veil-t82:rgba(255,255,255,.82);--veil-t78:rgba(255,255,255,.78);--veil-t72:rgba(255,255,255,.72);--veil-t50:rgba(255,255,255,.5);--veil-t42:rgba(255,255,255,.42);
--veil-12:rgba(255,255,255,.12);--veil-10:rgba(255,255,255,.10);--veil-09:rgba(255,255,255,.09);--veil-08:rgba(255,255,255,.08);--veil-06:rgba(255,255,255,.06);--veil-05:rgba(255,255,255,.05);--veil-04:rgba(255,255,255,.04);--veil-03:rgba(255,255,255,.03);
--accent:#d81f2a;--accent-hover:#b81620;--accent-tint:rgba(225,29,42,.16);--sel:rgba(225,29,42,.28);--card-shadow:none;
}
[data-theme="light"]{
--bg-page:#F4F6FA;--bg-surface:#FFFFFF;--bg-surface-raised:#FFFFFF;--bg-hover:#EEF1F6;
--border-subtle:#EDF0F6;--border-default:#E6E9F0;--divider:#EDF0F6;--border-mid:#E6E9F0;--border-strong:#D7DBE6;
--text-primary:#0E1525;--text-hi:#2A3346;--text-secondary:#465063;--text-muted:#6B7488;--text-dim:#6B7488;--text-faint:#98A1B3;
--gauge-track:#E8ECF2;--chart-track:#EDF0F6;--chart-grid:#EDF0F6;
--card-inner:#FFFFFF;--tb-card-bg:#FFFFFF;--chip-bg:#F4F6FA;--chip-hover:#EBEEF4;--card-dots:transparent;--th-bg:#E2E7EF;
--veil-t88:rgba(14,21,37,.9);--veil-t82:rgba(14,21,37,.82);--veil-t78:rgba(14,21,37,.68);--veil-t72:rgba(14,21,37,.62);--veil-t50:rgba(14,21,37,.5);--veil-t42:rgba(14,21,37,.42);
--veil-12:rgba(14,21,37,.08);--veil-10:rgba(14,21,37,.06);--veil-09:rgba(14,21,37,.10);--veil-08:rgba(14,21,37,.08);--veil-06:rgba(14,21,37,.04);--veil-05:rgba(14,21,37,.045);--veil-04:rgba(14,21,37,.035);--veil-03:rgba(14,21,37,.03);
--sev-critical:#C4101A;--sev-high:#D1560A;--sev-medium:#B8860B;--sev-low:#8F8F0A;--sev-info:#2F6FB5;--sev-safe:#2E9C6D;
--accent-tint:rgba(196,16,26,.09);--sel:rgba(196,16,26,.2);--card-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
html{transition:background-color .2s ease,color .2s ease;}
.stat-card,.ov-tile,#sb,#sb-ws-footer,#app-shell>div,header,.inp,.chip,.fchip,.sb-item,.perbtn,.tbl-row,.sev{transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease;}
::selection{background:var(--sel);}
[data-theme="light"] .stat-card,[data-theme="light"] .ov-tile,[data-theme="light"] .stat-card.tb-card{box-shadow:var(--card-shadow);}
[data-theme="light"] .stat-card{border-color:transparent;}
[data-theme="light"] .dtbl th{border-bottom:1px solid #CBD2DE;}
[data-theme="light"] .ov-idx{color:#B7BECD;}
[data-theme="light"] .sev-fx{color:#0E1525!important;}
[data-theme="light"] header{background:#FFFFFF!important;border-bottom:1px solid #E6E9F0;box-shadow:0 1px 2px rgba(14,21,37,.04);}
[data-theme="light"] #sb,[data-theme="light"] .sb-header-inner,[data-theme="light"] #sb-ws-footer{background:#FFFFFF!important;}
[data-theme="light"] #sb{border-right:1px solid #E6E9F0!important;}
[data-theme="light"] .sb-item{color:#465063;}
[data-theme="light"] .sb-item:hover{color:#0E1525;}
[data-theme="light"] .sb-item.active{color:#C4101A;background:rgba(196,16,26,.07);box-shadow:inset 3px 0 0 #C4101A;}
[data-theme="light"] .sb-item.active .sb-ico{color:#C4101A;}
[data-theme="light"] .sev-fx{font-weight:800;letter-spacing:.06em;color:#0E1525!important;}
[data-theme="light"] .ov-lbl{color:#465063;}
[data-theme="light"] .ov-sub{color:#6B7488;}
[data-theme="light"] .ov-tile{border:1px solid #E6E9F0;}
[data-theme="light"] .ov-idx{color:#AEB6C6;}
[data-theme="light"] .onb-cat-emit{display:none;}
[data-theme="light"] .onb-cat-glow{mix-blend-mode:normal;opacity:.9;background:radial-gradient(circle,rgba(225,16,27,.42),rgba(225,16,27,.16) 45%,transparent 68%);}
[data-theme="light"] .onb-cat-img{mix-blend-mode:normal;filter:drop-shadow(0 24px 40px rgba(14,21,37,.16));}
[data-theme="light"] .sb-bdg{box-shadow:none;}
[data-theme="light"] .ov-num.is-crit{text-shadow:none;}
[data-theme="light"] .perbtn.on{box-shadow:none;text-shadow:none;}
[data-theme="light"] .perbtn:hover{text-shadow:none;background:var(--bg-hover);}
[data-theme="light"] .perpanel{box-shadow:0 8px 28px rgba(0,0,0,.12);}
/* Theme toggle icon crossfade */
.th-ico{position:absolute;transition:opacity .2s ease,transform .2s ease;}
.th-sun{opacity:1;transform:rotate(0);}
.th-moon{opacity:0;transform:rotate(90deg);}
[data-theme="light"] .th-sun{opacity:0;transform:rotate(-90deg);}
[data-theme="light"] .th-moon{opacity:1;transform:rotate(0);}
@media(prefers-reduced-motion:reduce){html,.stat-card,.ov-tile,#sb,.sb-item,.th-ico{transition:none;}}
body{font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;}
.mono{font-family:"Geist Mono",ui-monospace,monospace;}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,58,58,.6);}50%{box-shadow:0 0 0 4px rgba(239,58,58,0);}}
@keyframes pulse-safe{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 4px rgba(34,197,94,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.dot-pulse{animation:pulse-red 2s ease-in-out infinite;}
.dot-safe{animation:pulse-safe 2s ease-in-out infinite;}
.spin{animation:spin 1s linear infinite;}
/* Sidebar */
.sb-disabled{opacity:.35;pointer-events:none;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-family:"Geist",sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;position:relative;color:var(--veil-t72);transition:background .15s,color .15s;white-space:nowrap;}
.sb-item:hover{background:var(--veil-06);color:white;}
.sb-item.active{background:rgba(225,29,42,.16);box-shadow:inset 2.5px 0 0 #e11d2a;border-radius:0 7px 7px 0;color:#ff5a63;font-weight:600;padding-left:14px;}
.sb-item.active .sb-ico{color:#ff5a63;}
.sb-ico{display:grid;place-items:center;flex-shrink:0;width:20px;height:20px;}
.sb-lbl{flex:1;overflow:hidden;transition:opacity .2s;}
.sb-bdg{font-family:"Geist Mono",monospace;font-size:10px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#e11d2a;color:white;display:grid;place-items:center;flex-shrink:0;transition:opacity .2s;box-shadow:0 0 8px rgba(225,29,42,.4);}
.sb-tgl-btn:hover{background:var(--veil-12)!important;color:var(--veil-t82)!important;}
/* Collapsed, based on v4 M3 True Black */
#sb.sb-c{width:64px!important;}
#sb.sb-c #sb-wm{display:none;}
#sb.sb-c #sb-ws-info,#sb.sb-c #sb-ws-chev{display:none;}
#sb.sb-c .sb-lbl{display:none;}
#sb.sb-c .sb-bdg{display:none;}
#sb.sb-c #sb-logo{width:48px!important;height:48px!important;}
#sb.sb-c .sb-header-inner{justify-content:center;padding:12px 7px;}
#sb.sb-c #sb-tgl{display:none!important;}
#sb.sb-c nav{padding:6px 0 20px;}
#sb.sb-c .sb-item{justify-content:center;padding:9px 0;gap:0;width:100%;}
#sb.sb-c .sb-item.active{background:rgba(216,31,42,.14);box-shadow:inset 3px 0 0 #d81f2a;border-radius:0 5px 5px 0;}
/* expand button, only visible when collapsed */
#sb-expand-btn{display:none;}
#sb.sb-c #sb-expand-btn{display:flex;}
/* workspace footer collapsed */
#sb.sb-c #sb-ws-footer{padding:6px 0;}
#sb.sb-c #sb-ws-info,#sb.sb-c #sb-ws-chev{display:none;}
#sb.sb-c #sb-ws-footer button{justify-content:center;padding:6px;}

/* Table */
.tbl-row{display:grid;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border-default);cursor:pointer;transition:background .12s;min-height:44px;}
.tbl-row:hover{background:var(--bg-surface-raised);}
.tbl-row:last-child{border-bottom:none;}
/* Severity badges */
:root{--sev-critical:#ff2d3d;--sev-high:#ff6a3d;--sev-medium:#f5a524;--sev-low:#f5d524;--sev-info:#4aa3ff;--sev-safe:#2ecc8b;--surface-deep:var(--bg-page);}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.sev-fx{min-width:78px;height:auto;padding:2px 10px;justify-content:center;font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;border-radius:100px;border:none!important;color:var(--surface-deep)!important;flex-shrink:0;}
.sev-fx.sev-critical{background:var(--sev-critical);}
.sev-fx.sev-high{background:var(--sev-high);}
.sev-fx.sev-medium{background:var(--sev-medium);}
.sev-fx.sev-low{background:var(--sev-low);}
.sev-fx.sev-info{background:var(--sev-info);}
.sev-fx.sev-safe{background:var(--sev-safe);}
.sev-critical{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.25);}
.sev-high{background:rgba(249,115,22,.12);color:#f97316;border:1px solid rgba(249,115,22,.22);}
.sev-medium{background:rgba(234,179,8,.12);color:#eab308;border:1px solid rgba(234,179,8,.22);}
.sev-low{background:rgba(34,197,94,.10);color:#22c55e;border:1px solid rgba(34,197,94,.18);}
.sev-info{background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.22);}
/* Status badges */
.st-done{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.22);}
.st-running{background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.22);}
.st-failed{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.25);}
.st-skipped{background:rgba(112,112,112,.12);color:var(--text-dim);border:1px solid rgba(112,112,112,.22);}
.st-queued{background:rgba(234,179,8,.12);color:#eab308;border:1px solid rgba(234,179,8,.22);}
.st-blocked{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.25);}
/* Slide-over */
.slide-over{position:fixed;top:0;right:0;bottom:0;width:520px;background:var(--bg-surface);border-left:1px solid var(--border-default);z-index:50;transform:translateX(100%);transition:transform .25s cubic-bezier(.22,.61,.36,1);overflow-y:auto;}
.slide-over.open{transform:translateX(0);}
.slide-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;opacity:0;display:none;pointer-events:none;transition:opacity .25s;}
.slide-overlay.open{opacity:1;display:block;pointer-events:auto;}
.card-link{transition:background .12s,border-color .12s;}
.card-link:hover{background:var(--bg-surface-raised);}
.metric-link:hover .metric-lbl{text-decoration:underline;}
/* ── Overview KPI tiles (tech-brutalist) ── */
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px;}
@media(max-width:1199px){.ov-grid{grid-template-columns:repeat(2,1fr);}}
.ov-tile{position:relative;padding:18px 20px 16px;background:var(--bg-surface);cursor:pointer;overflow:hidden;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));background-image:radial-gradient(var(--veil-04) 1px,transparent 1px);background-size:13px 13px;background-position:-1px -1px;transition:transform .14s ease,background-color .14s;}
.ov-tile:hover{transform:translateY(-2px);background-color:var(--bg-surface);}
.ov-tile::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--ov-accent,#d81f2a);transform:scaleX(0);transform-origin:left;transition:transform .18s ease;}
.ov-tile:hover::after{transform:scaleX(1);}
.ov-idx{position:absolute;top:14px;right:16px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--border-mid);letter-spacing:.06em;}
.ov-mark{width:6px;height:6px;background:var(--ov-accent,var(--text-faint));margin-bottom:13px;}
.ov-lbl{font-family:"JetBrains Mono",monospace;text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--text-muted);margin-bottom:9px;}
.ov-num{font-family:"Chakra Petch","JetBrains Mono",monospace;font-weight:700;font-size:52px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--text-primary);}
.ov-num.is-crit{color:var(--sev-critical);text-shadow:0 0 12px rgba(255,45,61,.35);}
.ov-num.is-high{color:var(--sev-high);}
.ov-sub{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--text-faint);margin-top:11px;letter-spacing:.02em;}
@media(max-width:1199px){.ov-tile:hover{transform:none;}}
.dn-grow{animation:dnGrow .4s ease-out both;}
@keyframes dnGrow{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.dn-grow{animation:none;}}
.fcharts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
@media(max-width:1199px){.fcharts{grid-template-columns:1fr 1fr;}}
@media(max-width:820px){.fcharts{grid-template-columns:1fr;}}
.chart-in{animation:chartIn .4s ease-out both;}
/* Mascote hero (onboarding), glow + bob + emit, mesmos efeitos da landing */
.onb-cat{position:relative;display:flex;align-items:center;justify-content:center;width:128%;margin:-8% -14% -8% 0;}
.onb-cat-glow{position:absolute;width:92%;aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle,rgba(229,51,59,.3),rgba(229,51,59,.1) 42%,transparent 66%);filter:blur(38px);pointer-events:none;mix-blend-mode:screen;animation:breatheGlow 3.8s ease-in-out infinite;}
.onb-cat-img{position:relative;width:100%;height:auto;display:block;animation:catBob 5.5s ease-in-out infinite;-webkit-mask-image:radial-gradient(120% 108% at 52% 42%,#000 58%,rgba(0,0,0,.35) 82%,transparent 100%);mask-image:radial-gradient(120% 108% at 52% 42%,#000 58%,rgba(0,0,0,.35) 82%,transparent 100%);filter:drop-shadow(0 30px 46px rgba(0,0,0,.55)) saturate(.96) brightness(.97);}
.onb-cat-emit{position:absolute;inset:0;width:100%;height:auto;display:block;pointer-events:none;mix-blend-mode:screen;opacity:.2;-webkit-mask-image:radial-gradient(120% 108% at 52% 42%,#000 58%,rgba(0,0,0,.35) 82%,transparent 100%);mask-image:radial-gradient(120% 108% at 52% 42%,#000 58%,rgba(0,0,0,.35) 82%,transparent 100%);filter:drop-shadow(0 0 6px rgba(255,77,84,.55));animation:catBob 5.5s ease-in-out infinite,breatheEmit 3.8s ease-in-out infinite;}
@keyframes catBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes breatheGlow{0%,100%{opacity:.72;filter:blur(38px)}50%{opacity:1;filter:blur(50px)}}
@keyframes breatheEmit{0%,100%{opacity:.14}50%{opacity:.58}}
@media(prefers-reduced-motion:reduce){.onb-cat-img,.onb-cat-emit,.onb-cat-glow{animation:none;}}
@keyframes chartIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.chart-in{animation:none;}}
.schart .srow,.tchart .tcol{transition:opacity .15s ease-out;}
.catbars .catrow{transition:opacity .3s ease-out,outline-color .15s;outline:1px solid transparent;outline-offset:-1px;cursor:pointer;border-radius:2px;}
.catbars:not(.has-sel):hover .catrow:not(:hover){opacity:.4;}
.catbars .catrow:hover{opacity:1;}
.catbars.has-sel .catrow:not(.sel){opacity:.3;}
.catbars.has-sel .catrow.sel{opacity:1;}
.catbars .catrow.sel{outline-color:var(--rowc,#E1101B);}
.catbars .bar-in{transition:width .3s ease-out;}
/* Barra de filtros ativos */
.filtbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.filtbar-count{font-family:"Open Sans",sans-serif;font-size:12px;color:var(--text-muted);white-space:nowrap;}
.filtbar-count b{color:#fff;font-weight:900;font-variant-numeric:tabular-nums;}
.filtbar-chips{display:flex;gap:7px;flex-wrap:wrap;flex:1;min-width:0;}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;background:var(--chip-bg);border:1px solid var(--border-default);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px));cursor:pointer;transition:border-color .15s,background .15s;}
.fchip:hover{border-color:#E1101B;background:var(--chip-hover);}
.fchip-k{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
.fchip-v{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-primary);}
.fchip-x{font-size:13px;line-height:1;color:var(--text-muted);}.fchip:hover .fchip-x{color:#E1101B;}

/* Diff */
.diff-add{color:#22c55e;background:rgba(34,197,94,.07);}

.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;cursor:pointer;border-radius:4px;transition:all .14s;white-space:nowrap;border:1px solid transparent;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border-default);color:var(--text-secondary);background:transparent;transition:background .12s,border-color .12s,color .12s;text-transform:capitalize;}

.tier-bubble{display:inline-flex;align-items:center;gap:5px;font-family:"Geist Mono",monospace;font-size:10px;font-weight:600;}

/* Attack path step, sequential reveal */
.ap-step{display:flex;gap:16px;align-items:flex-start;position:relative;}
.ap-conn{position:absolute;left:15px;top:36px;bottom:-20px;width:2px;background:var(--gauge-track);overflow:hidden;z-index:0;}
.ap-conn .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--sc) 50%,transparent);transform:scaleY(0);transform-origin:top;transition:transform .35s linear;}
.ap-conn.filled .fill{transform:scaleY(1);}
.ap-conn .shim{position:absolute;left:0;right:0;height:40%;top:0;background:linear-gradient(180deg,transparent,rgba(239,68,68,.55),transparent);transform:translateY(-100%);opacity:0;}
.ap-conn.filled.crit .shim{animation:ap-shim 6s linear infinite;}

.ap-step.lit .ap-ring{animation:ap-pulse .4s ease-out;}
.ap-step.climax .ap-ring{animation:ap-pulse .5s ease-out 2;}

.ap-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-family:"Geist Mono",monospace;font-size:12px;font-weight:900;color:#ffffff;background:var(--sc);transition:color .3s ease-out,background .3s ease-out,box-shadow .3s ease-out;position:relative;z-index:1;}

.ap-body{flex:1;padding-top:4px;opacity:1;transform:none;transition:opacity .25s ease-out,transform .25s ease-out;min-width:0;}
.ap-tactic{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--sc);}
.ap-fcard{background:var(--bg-surface);border:1px solid var(--border-default);border-left:2px solid var(--sc);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .12s;}

function tierGate(n,j){
  const prev=n===1?j.tier1_status:j.tier2_status;
  const next=n===1?j.tier2_status:j.tier3_status;
  const blocked=j.blocked_at_tier===n;
  const passed=!blocked&&prev==='done'&&!!next;
  const seg=prev==='done'&&next==='running'?'flow':prev==='done'&&next?'solid':'idle';
  const lineStyle=seg==='solid'?'background:rgba(34,197,94,.5);':seg==='flow'?'':'background:var(--gauge-track);';
  const lineCls=seg==='flow'?' class="conn-flow"':'';

/* ── Donut de severidade (Início), paleta fixa de gráficos, fechado e fino ── */
const CHART_SEV={critical:'#E1101B',high:'#F2600C',medium:'#E8B004',low:'#E8E004',info:'#2F86E0'};
/* Componente de donut reutilizável (arco fino, trilho de fundo, hover com crossfade no centro).
   entries: [{key,n,color,name}], pré-filtradas/ordenadas pelo chamador. Usado na Início e em Findings. */
function donutComponent({id,entries,total,centerLabel='TOTAL',size=184}){
  const r=42,sw=14,C=2*Math.PI*r,cx=60,cy=60,gapDeg=2,gapArc=C*gapDeg/360;
  let acc=0,segs='';
  entries.filter(e=>e.n>0).forEach(({key,n,color,name})=>{
    const frac=n/total,pct=Math.round(frac*100);
    const drawLen=Math.max(frac*C-gapArc,0.5);
    const startDeg=(acc/total)*360-90+gapDeg/2;
    segs+=`<circle class="dn-seg" data-key="${key}" data-name="${name||key}" data-color="${color}" data-n="${n}" data-pct="${pct}" data-len="${drawLen.toFixed(2)}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="butt" stroke-dasharray="0 ${C.toFixed(2)}" transform="rotate(${startDeg.toFixed(2)} ${cx} ${cy})" style="transition:opacity .15s,stroke-width .15s;"/>`;
    acc+=n;
  });
  const dg=String(total).length,numSize=dg<=2?32:dg===3?28:24;
  return `<div class="dn-wrap" style="position:relative;width:${size}px;height:${size}px;flex-shrink:0;">
    <svg width="${size}" height="${size}" viewBox="0 0 120 120" id="${id}" data-donut class="dn-grow">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--chart-track)" stroke-width="${sw}"/>
      ${segs}
    </svg>
    <div class="dn-c-default" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity .18s;">
      <div class="mono" style="font-size:${numSize}px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;line-height:1;" data-count-to="${total}">${total}</div>
      <div class="mono" style="font-size:9px;letter-spacing:.14em;color:var(--text-dim);margin-top:3px;">${centerLabel}</div>
    </div>
    <div class="dn-c-detail" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .18s;">
      <div class="dn-d-val mono" style="font-size:32px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;line-height:1;">0</div>
      <div class="dn-d-pct mono" style="font-size:12px;color:var(--text-secondary);margin-top:3px;">0%</div>
      <div class="dn-d-name mono" style="font-size:8px;letter-spacing:.03em;text-transform:uppercase;margin-top:4px;color:var(--text-primary);max-width:${size-58}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;">—</div>
    </div>
  </div>`;
}
function sevDonut(sevCounts,total){
  const entries=Object.entries(sevCounts).map(([s,n])=>({key:s,n,color:CHART_SEV[s],name:s}));
  return donutComponent({id:'sev-donut',entries,total});
}
const DONUT_DIM={'repo-donut':'repositorios'};
function initDonut(){
  document.querySelectorAll('[data-donut]').forEach(donut=>{
    const id=donut.id;
    const wrap=donut.closest('.dn-wrap');if(!wrap)return;
    const segs=[...donut.querySelectorAll('.dn-seg')];
    const rows=[...document.querySelectorAll(`.dn-row[data-donut="${id}"]`)];
    const def=wrap.querySelector('.dn-c-default'),det=wrap.querySelector('.dn-c-detail');
    const dVal=wrap.querySelector('.dn-d-val'),dPct=wrap.querySelector('.dn-d-pct'),dName=wrap.querySelector('.dn-d-name');
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const C=2*Math.PI*42;
    const dim=DONUT_DIM[id];
    const selVals=(dim&&typeof FF!=='undefined')?FF[dim]:[];
    const hasSel=selVals.length>0;
    if(reduce){segs.forEach(sg=>sg.setAttribute('stroke-dasharray',`${sg.dataset.len} ${C.toFixed(2)}`));}
    else{const t0=performance.now();(function draw(t){const p=Math.min((t-t0)/700,1),e=1-Math.pow(1-p,3);segs.forEach(sg=>{const L=+sg.dataset.len;sg.setAttribute('stroke-dasharray',`${(L*e).toFixed(2)} ${C.toFixed(2)}`);});if(p<1)requestAnimationFrame(draw);})(t0);}
    const base=()=>{
      segs.forEach(sg=>{const on=!hasSel||selVals.includes(sg.dataset.key);sg.style.opacity=on?'1':'.3';sg.setAttribute('stroke-width',hasSel&&selVals.includes(sg.dataset.key)?'18':'14');});
      rows.forEach(r=>{const on=!hasSel||selVals.includes(r.dataset.key);r.style.opacity=on?'1':'.3';r.classList.toggle('pill-sel',hasSel&&selVals.includes(r.dataset.key));});
      def.style.opacity='1';det.style.opacity='0';
    };
    const focus=key=>{
      if(!key){base();return;}
      segs.forEach(sg=>{const on=sg.dataset.key===key;sg.style.opacity=on?'1':'.25';sg.setAttribute('stroke-width',on?'19':'14');});
      rows.forEach(r=>r.style.opacity=r.dataset.key!==key?'.4':'1');
      const sg=segs.find(x=>x.dataset.key===key);if(sg){dVal.textContent=sg.dataset.n;dPct.textContent=sg.dataset.pct+'%';dName.textContent=sg.dataset.name;dName.style.color=sg.dataset.color;}
      def.style.opacity='0';det.style.opacity='1';
    };
    base();
    segs.forEach(sg=>{sg.addEventListener('mouseenter',()=>focus(sg.dataset.key));sg.addEventListener('mouseleave',()=>focus(null));if(dim){sg.style.cursor='pointer';sg.addEventListener('click',e=>onDimClick(e,dim,sg.dataset.key));}});
    rows.forEach(r=>{r.addEventListener('mouseenter',()=>focus(r.dataset.key));r.addEventListener('mouseleave',()=>focus(null));});
  });
}
function initCountUps(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('[data-count-to]').forEach(el=>{
    if(el.dataset.counted)return;
    el.dataset.counted='1';
    const target=+el.dataset.countTo,t0=performance.now();
    function tick(t){
      const p=Math.min((t-t0)/800,1),e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e);
      if(p<1)requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

/* Estado de filtro centralizado, fonte única lida/escrita por gráficos, barra de filtros e tabela */
const FF={repositorios:[],categorias:[],severidades:[],scanners:[],tiers:[],faixaAging:[],status:null,periodo:{de:null,ate:null},busca:''};
const FF_DIMS=['repositorios','categorias','severidades','scanners','tiers','faixaAging'];
function ffAnyActive(){return FF_DIMS.some(d=>FF[d].length)||FF.status||!!FF.busca||periodPreset()!=='90';}
function agingBucketOf(x){const a=Math.max(0,Math.floor((REF_NOW-new Date(x.created_at).getTime())/DAY));return a<=7?'0-7':a<=30?'8-30':a<=90?'31-90':'+90';}
const AGING_LABELS={'0-7':'0–7 dias','8-30':'8–30 dias','31-90':'31–90 dias','+90':'+90 dias'};
function applyScope(){
  let s=FINDINGS.slice();
  if(FF.repositorios.length)s=s.filter(x=>FF.repositorios.includes(x.asset));
  if(FF.categorias.length)s=s.filter(x=>FF.categorias.includes(cweClass(x)));
  if(FF.severidades.length)s=s.filter(x=>FF.severidades.includes(x.severity));
  if(FF.scanners.length)s=s.filter(x=>FF.scanners.includes(x.source));
  if(FF.tiers.length)s=s.filter(x=>FF.tiers.includes(x.tier));
  if(FF.faixaAging.length)s=s.filter(x=>FF.faixaAging.includes(agingBucketOf(x)));
  if(FF.periodo.de)s=s.filter(x=>new Date(x.created_at).getTime()>=FF.periodo.de);
  if(FF.periodo.ate)s=s.filter(x=>new Date(x.created_at).getTime()<=FF.periodo.ate);
  if(FF.busca){const q=FF.busca.toLowerCase();s=s.filter(x=>x.title.toLowerCase().includes(q)||(x.file_path||'').toLowerCase().includes(q)||(x.cve_id||'').toLowerCase().includes(q));}
  return s;
}
function toggleDim(dim,val,additive){
  const arr=FF[dim];const i=arr.findIndex(v=>v===val);
  if(additive){if(i>=0)arr.splice(i,1);else arr.push(val);}
  else{FF[dim]=(i>=0&&arr.length===1)?[]:[val];}
  rerenderFindings();
}
function onDimClick(ev,dim,val){const add=!!(ev&&(ev.ctrlKey||ev.metaKey));toggleDim(dim,val,add);}
function removeChipFilter(dim,val){const arr=FF[dim];const i=arr.findIndex(v=>v===val);if(i>=0)arr.splice(i,1);rerenderFindings();}
function setBusca(v){FF.busca=v;rerenderFindings();const el=document.querySelector('#findings-search');if(el){el.focus();const n=el.value.length;el.setSelectionRange(n,n);}}
function rerenderFindings(){const m=document.getElementById('app-main');if(!m)return;m.innerHTML=renderFindings();bindFindingsEvents();initDonut();initCountUps();syncFindingsBadge();syncURL();}
let findingsSort={col:'sev',dir:'desc'};
function setFindingSort(col){
  if(findingsSort.col===col)findingsSort.dir=findingsSort.dir==='asc'?'desc':'asc';
  else findingsSort={col,dir:col==='sev'?'desc':'asc'};
  rerenderFindings();
}
function goFindings(f){FF_DIMS.forEach(d=>FF[d]=[]);FF.status=null;FF.busca='';FF.periodo={de:ffDefaultDe(),ate:null};if(f&&f.sev)FF.severidades=[f.sev];navigate('findings');}
/* Seletor de período */
let periodPanelOpen=false;
function setPeriod(preset){periodPanelOpen=false;FF.status=null;if(preset==='all')FF.periodo={de:null,ate:null};else FF.periodo={de:REF_NOW-(+preset)*DAY,ate:null};rerenderFindings();}
function togglePeriodPanel(){periodPanelOpen=!periodPanelOpen;rerenderFindings();}
function applyCustomPeriod(){const de=document.getElementById('per-de').value,ate=document.getElementById('per-ate').value;FF.periodo={de:de?new Date(de+'T00:00:00Z').getTime():null,ate:ate?new Date(ate+'T23:59:59Z').getTime():null};FF.status=null;periodPanelOpen=false;rerenderFindings();}
function periodPreset(){const{de,ate}=FF.periodo;if(ate!=null)return 'custom';if(de==null)return 'all';const d=Math.round((REF_NOW-de)/DAY);if(d===7)return '7';if(d===30)return '30';if(d===90)return '90';return 'custom';}
function periodNoteLabel(){const p=periodPreset();if(p==='7')return 'Últimos 7 dias, por dia';if(p==='30')return 'Últimos 30 dias, por semana';if(p==='90')return 'Últimos 90 dias, por quinzena';if(p==='all')return 'Todo o histórico';const de=FF.periodo.de?new Date(FF.periodo.de).toLocaleDateString('pt-BR'):'início';const ate=FF.periodo.ate?new Date(FF.periodo.ate).toLocaleDateString('pt-BR'):'hoje';return `De ${de} a ${ate}`;}
function periodSelector(){

  const btn=(v,l)=>`<button class="perbtn${act===v?' on':''}" onclick="setPeriod('${v}')">${l}</button>`;

  return `<div class="perwrap">
    <div class="perseg">${btn('7','7d')}${btn('30','30d')}${btn('90','90d')}${btn('all','Tudo')}<button class="perbtn${act==='custom'?' on':''}" onclick="togglePeriodPanel()">Personalizado</button></div>
    ${periodPanelOpen?`<div class="perpanel">
      <label>De <input id="per-de" type="date" value="${de}"/></label>
      <label>Até <input id="per-ate" type="date" value="${ate}"/></label>
      <button class="perbtn on" onclick="applyCustomPeriod()">Aplicar</button>
    </div>`:''}
  </div>`;
}
/* URL <-> estado */
const FF_URL={repositorios:'repo',categorias:'cat',severidades:'sev',scanners:'scanner',tiers:'tier',faixaAging:'aging'};
function syncURL(){
  const p=new URLSearchParams();
  Object.entries(FF_URL).forEach(([d,k])=>{if(FF[d].length)p.set(k,FF[d].join(','));});
  if(FF.status)p.set('status',FF.status);
  if(FF.busca)p.set('q',FF.busca);
  if(FF.periodo.de!=null)p.set('de',FF.periodo.de);
  if(FF.periodo.ate!=null)p.set('ate',FF.periodo.ate);
  const qs=p.toString();
  try{history.replaceState(null,'',qs?('?'+qs):location.pathname);}catch(e){}
}
function parseURLToFF(){
  const p=new URLSearchParams(location.search);let any=false;
  Object.entries(FF_URL).forEach(([d,k])=>{const v=p.get(k);if(v){FF[d]=v.split(',').map(x=>d==='tiers'?+x:x);any=true;}});
  if(p.get('status')){FF.status=p.get('status');any=true;}
  if(p.get('q')){FF.busca=p.get('q');any=true;}
  if(p.get('de')!=null){FF.periodo.de=+p.get('de');any=true;}else{FF.periodo.de=ffDefaultDe();}
  if(p.get('ate')!=null){FF.periodo.ate=+p.get('ate');any=true;}
  return any;
}
try{parseURLToFF();}catch(e){FF.periodo.de=REF_NOW-90*DAY;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentScreen==='findings'&&ffAnyActive()){clearFindingFilters();}});
function openChainFinding(id){const job=currentExecId?SCAN_JOBS.find(j=>j.id===currentExecId):SCAN_JOBS[0];const ins=job&&INSIGHTS[job.id];window.currentFindingIds=ins&&ins.attack_path?ins.attack_path.map(s=>s.finding_ids[0]).filter(Boolean):[id];openFinding(id);}

const SEV_STACK=['critical','high','medium','low','info'];
const SEV_WEIGHT={critical:1000,high:100,medium:10,low:1,info:0};
function severityWeight(f){return SEV_WEIGHT[f.severity]||0;}
function emptyChart(msg){return `<div style="text-align:center;color:var(--text-faint);font-size:12px;padding:34px 0;">${msg}</div>`;}
function fChartCard(idx,title,body,note){
  return `<div class="stat-card chart-in" style="padding:0;overflow:hidden;display:flex;flex-direction:column;">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border-default);"><h2 class="text-[14px] font-bold" style="white-space:nowrap;">${title}</h2></div>
    <div style="padding:16px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:158px;">${body}</div>
    ${note?`<div style="padding:0 16px 12px;font-size:12px;font-weight:700;color:#fff;">${note}</div>`:''}
  </div>`;
}
/* Card 1, Risco por repositório: donut (mesmo componente da Início). Escala de cor por risco: repo
   de maior volume em vermelho de acento, demais em tons progressivamente neutros. */
const REPO_RISK_COLORS=['#E1101B','#F2600C','#E8B004','#2F86E0'];
function chartRepoBody(list){
  const repos=[...new Set(list.map(f=>f.asset))];
  const data=repos.map(r=>({r,team:REPO_TEAM[r]||'—',total:list.filter(f=>f.asset===r).length,weight:list.filter(f=>f.asset===r).reduce((a,f)=>a+severityWeight(f),0)}));
  data.sort((a,b)=>b.total-a.total||b.weight-a.weight);
  data.forEach((d,i)=>d.color=REPO_RISK_COLORS[Math.min(i,REPO_RISK_COLORS.length-1)]);
  const total=data.reduce((a,d)=>a+d.total,0);
  if(!total)return emptyChart('Sem dados para os filtros aplicados');
  const donut=donutComponent({id:'repo-donut',entries:data.map(d=>({key:d.r,n:d.total,color:d.color,name:d.r})),total,size:168});
  const pills=data.map(d=>{const sel=FF.repositorios.includes(d.r);return `<div class="dn-row" data-donut="repo-donut" data-key="${d.r}" tabindex="0" role="button" aria-pressed="${sel}" aria-label="Repositório ${d.r}, ${d.total} findings${sel?', selecionado':''}" style="--rowc:${d.color};display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px;margin:0 -6px;border-radius:3px;cursor:pointer;transition:opacity .15s;outline:1px solid transparent;outline-offset:-1px;" onclick="onDimClick(event,'repositorios','${d.r.replace(/'/g,"\\'")}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onDimClick(event,'repositorios','${d.r.replace(/'/g,"\\'")}');}">
    <div style="display:flex;align-items:center;gap:9px;min-width:0;">
      <span style="width:8px;height:8px;border-radius:2px;flex-shrink:0;background:${d.color};${d.color==='#E1101B'?'box-shadow:0 0 6px rgba(225,16,27,.35);':''}"></span>
      <div style="min-width:0;">
        <div class="mono" style="font-size:12px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.r}</div>
        <div class="mono" style="font-size:9.5px;color:var(--text-dim);">${d.team}</div>
      </div>
    </div>
    <span class="disp" style="font-size:16px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;flex-shrink:0;">${d.total}</span>
  </div>`;}).join('');
  return `<div style="display:flex;align-items:center;gap:28px;">${donut}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">${pills}</div></div>`;
}
/* Card 2, Top categorias: barras horizontais cor sólida = severidade predominante. Hover destaca uma,
   escurece as demais (.35) e mostra tooltip com quebra por severidade. */
function chartCategoryBody(list){
  const groups={};list.forEach(f=>{const c=cweClass(f);(groups[c]=groups[c]||[]).push(f);});
  const data=Object.entries(groups).map(([c,items])=>{const bySev={};SEV_STACK.forEach(s=>bySev[s]=items.filter(x=>x.severity===s).length);const mx=Math.max(...SEV_STACK.map(s=>bySev[s]));const pred=SEV_STACK.find(s=>bySev[s]===mx)||'info';return {c,total:items.length,pred,bySev};});
  data.sort((a,b)=>b.total-a.total);
  const maxT=Math.max(1,...data.map(d=>d.total));
  if(!data.length)return emptyChart('Sem dados para os filtros aplicados');
  const hasSel=FF.categorias.length>0;
  return `<div class="catbars${hasSel?' has-sel':''}" style="display:flex;flex-direction:column;gap:15px;">`+data.map(d=>{
    const col=CHART_SEV[d.pred];const glow=d.pred==='critical'?'box-shadow:0 0 6px rgba(225,16,27,.35);':'';
    const brk=SEV_STACK.filter(s=>d.bySev[s]>0).map(s=>`${s} ${d.bySev[s]}`).join(' · ');
    const sel=FF.categorias.includes(d.c);
    return `<div class="catrow${sel?' sel':''}" tabindex="0" role="button" aria-pressed="${sel}" aria-label="Categoria ${d.c}, ${d.total} findings${sel?', selecionado':''}" title="${d.c}, ${brk}" style="--rowc:${col};display:flex;align-items:center;gap:12px;" onclick="onDimClick(event,'categorias','${d.c.replace(/'/g,"\\'")}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onDimClick(event,'categorias','${d.c.replace(/'/g,"\\'")}');}">
      <span style="width:132px;flex-shrink:0;text-align:right;font-size:12px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.c}</span>
      <div style="flex:1;height:16px;background:var(--chart-track);border-radius:2px;overflow:hidden;"><div class="bar-in" style="width:${(d.total/maxT*100).toFixed(1)}%;height:100%;background:${col};border-radius:2px;${glow}"></div></div>
      <span class="disp" style="width:26px;font-size:16px;font-weight:900;color:#fff;text-align:right;font-variant-numeric:tabular-nums;">${d.total}</span>
    </div>`;
  }).join('')+`</div>`;
}
/* Card 3, Abertos vs. remediados: barras verticais agrupadas em 6 quinzenas (90 dias).
   Por período: novos abertos (created_at) vs. remediados (resolved_at). Hover no grupo escurece os demais. */
function ffDefaultDe(){return REF_NOW-90*DAY;}
function chartOpenVsRemedBody(scoped){
  const end=FF.periodo.ate||REF_NOW;
  const start=(FF.periodo.de!=null)?FF.periodo.de:ffDefaultDe();
  const days=Math.max(1,Math.round((end-start)/DAY));
  let span;if(days<=7)span=1;else if(days<=31)span=7;else span=15;
  const nP=Math.max(1,Math.ceil(days/span));
  const periods=[];
  for(let i=0;i<nP;i++){const bs=start+i*span*DAY;const be=Math.min(bs+span*DAY,end+1);periods.push({start:bs,end:be,op:0,rem:0});}
  scoped.forEach(f=>{
    const c=new Date(f.created_at).getTime();
    for(const p of periods){if(c>=p.start&&c<p.end){p.op++;break;}}
    if(f.resolved_at){const r=new Date(f.resolved_at).getTime();for(const p of periods){if(r>=p.start&&r<p.end){p.rem++;break;}}}
  });
  const maxY=Math.max(1,...periods.map(p=>Math.max(p.op,p.rem)));
  if(periods.every(p=>p.op===0&&p.rem===0))return emptyChart('Sem dados para os filtros aplicados');
  const W=340,H=176,pl=24,pr=6,pt=14,pb=26,pw=W-pl-pr,ph=H-pt-pb;
  const base=pt+ph,gW=pw/nP,pad=gW*0.22,inner=gW-pad*2,barW=(inner-4)/2;
  const Y=v=>base-(v/maxY)*ph;
  const ticks=4,grid=[],ylab=[];
  for(let t=0;t<=ticks;t++){const v=Math.round(maxY*t/ticks);const y=Y(v).toFixed(1);grid.push(`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" style="stroke:var(--chart-grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>`);ylab.push(`<text x="${pl-7}" y="${(+y+4).toFixed(1)}" text-anchor="end" style="font-family:'JetBrains Mono',monospace;font-size:12px;fill:var(--text-primary);">${v}</text>`);}
  const perSel=p=>FF.periodo.de===p.start&&FF.periodo.ate===p.end;
  const anyPerSel=periods.some(perSel);
  const bars=periods.map((p,i)=>{
    const gx=pl+i*gW+pad;
    const oy=Y(p.op),ry=Y(p.rem);
    const oh=Math.max(base-oy,p.op>0?1.5:0),rh=Math.max(base-ry,p.rem>0?1.5:0);
    const lbl=`abertos ${p.op} · remediados ${p.rem}`;
    const sel=perSel(p);
    const grpDim=(anyPerSel&&!sel)?'opacity:.3;':'';
    const oDim=(FF.status==='resolved')?'opacity:.35;':'';
    const rDim=(FF.status==='open')?'opacity:.35;':'';
    return `<g class="bgrp" style="transition:opacity .3s;${grpDim}">
      <rect class="obar" tabindex="0" role="button" aria-label="Abertos no período, ${p.op} findings" x="${gx.toFixed(1)}" y="${(base-oh).toFixed(1)}" width="${barW.toFixed(1)}" height="${oh.toFixed(1)}" rx="2" fill="#E1101B" style="cursor:pointer;${oDim}" onclick="onBarClick(event,${p.start},${p.end},'open')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onBarClick(event,${p.start},${p.end},'open');}"><title>${lbl}</title></rect>
      <rect class="rbar" tabindex="0" role="button" aria-label="Remediados no período, ${p.rem} findings" x="${(gx+barW+4).toFixed(1)}" y="${(base-rh).toFixed(1)}" width="${barW.toFixed(1)}" height="${rh.toFixed(1)}" rx="2" fill="#3E9C6D" style="cursor:pointer;${rDim}" onclick="onBarClick(event,${p.start},${p.end},'resolved')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onBarClick(event,${p.start},${p.end},'resolved');}"><title>${lbl}</title></rect>
      <text class="gval" x="${(gx+barW).toFixed(1)}" y="${(Math.min(base-oh,base-rh)-6).toFixed(1)}" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:#fff;opacity:0;transition:opacity .15s;pointer-events:none;">${p.op}/${p.rem}</text>
    </g>`;
  }).join('');
  const xl=periods.map((p,i)=>{const d=new Date(p.start);const t=`${d.getUTCDate()}/${d.getUTCMonth()+1}`;const sel=perSel(p)&&!FF.status;return `<text x="${(pl+i*gW+gW/2).toFixed(1)}" y="${H-6}" text-anchor="middle" tabindex="0" role="button" aria-label="Período iniciando ${t}" style="font-family:'JetBrains Mono',monospace;font-size:12px;fill:${sel?'#fff':'var(--text-primary)'};font-weight:${sel?'700':'400'};cursor:pointer;" onclick="onPeriodLabelClick(event,${p.start},${p.end})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onPeriodLabelClick(event,${p.start},${p.end});}">${t}</text>`;}).join('');
  return `<div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" class="grpbars" style="display:block;">
      ${grid.join('')}
      ${bars}
      <line x1="${pl}" y1="${base}" x2="${W-pr}" y2="${base}" style="stroke:var(--chart-grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      ${ylab.join('')}${xl}
    </svg>
    <div style="display:flex;gap:16px;margin-top:8px;padding-left:${pl}px;">
      <span style="display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-primary);${FF.status==='resolved'?'opacity:.4;':''}"><span style="width:8px;height:8px;background:#E1101B;"></span>Abertos</span>
      <span style="display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-primary);${FF.status==='open'?'opacity:.4;':''}"><span style="width:8px;height:8px;background:#3E9C6D;"></span>Remediados</span>
    </div>
  </div>`;
}
function onBarClick(ev,start,end,status){const same=FF.periodo.de===start&&FF.periodo.ate===end&&FF.status===status;if(same){FF.periodo={de:ffDefaultDe(),ate:null};FF.status=null;}else{FF.periodo={de:start,ate:end};FF.status=status;}rerenderFindings();}
function onPeriodLabelClick(ev,start,end){const same=FF.periodo.de===start&&FF.periodo.ate===end&&!FF.status;if(same){FF.periodo={de:ffDefaultDe(),ate:null};}else{FF.periodo={de:start,ate:end};FF.status=null;}rerenderFindings();}
/* Faixa compacta, Aging dos findings abertos. Segmentos e legenda clicáveis (dimensão faixaAging). */
function agingBand(list){
  const buckets=[['0–7 dias','0-7',0,7],['8–30 dias','8-30',8,30],['31–90 dias','31-90',31,90],['+90 dias','+90',91,1e9]];
  const ageOf=x=>Math.max(0,Math.floor((REF_NOW-new Date(x.created_at).getTime())/DAY));
  const data=buckets.map(([lbl,key,lo,hi])=>({lbl,key,n:list.filter(x=>{const a=ageOf(x);return a>=lo&&a<=hi;}).length}));
  const total=Math.max(1,data.reduce((a,d)=>a+d.n,0));
  const cols=['#2ECC8B','#E8B004','#F2600C','#FF2D3D'];
  const hasSel=FF.faixaAging.length>0;
  const segs=data.map((d,i)=>{if(!d.n)return '';const sel=FF.faixaAging.includes(d.key);const op=hasSel&&!sel?'opacity:.3;':'';return `<div class="band-seg${sel?' sel':''}" tabindex="0" role="button" aria-pressed="${sel}" aria-label="Aging ${d.lbl}, ${d.n} findings${sel?', selecionado':''}" title="${d.lbl}: ${d.n}" style="--segc:${cols[i]};width:${(d.n/total*100).toFixed(1)}%;background:${cols[i]};${op}${i===3?'box-shadow:0 0 6px rgba(255,45,61,.35);':''}" onclick="onDimClick(event,'faixaAging','${d.key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onDimClick(event,'faixaAging','${d.key}');}"></div>`;}).join('');
  const legend=data.map((d,i)=>{const sel=FF.faixaAging.includes(d.key);return `<span class="band-leg${sel?' sel':''}" role="button" tabindex="0" aria-pressed="${sel}" aria-label="Aging ${d.lbl}, ${d.n} findings${sel?', selecionado':''}" style="--segc:${cols[i]};display:flex;align-items:center;gap:6px;font-size:11px;color:${i===3&&d.n>0?'#FF6A6A':'var(--text-secondary)'};${hasSel&&!sel?'opacity:.4;':''}" onclick="onDimClick(event,'faixaAging','${d.key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onDimClick(event,'faixaAging','${d.key}');}"><span style="width:8px;height:8px;flex-shrink:0;background:${cols[i]};"></span>${d.lbl} <span class="disp" style="font-weight:900;color:#fff;">${d.n}</span></span>`;}).join('');
  return `<div class="stat-card chart-in" style="padding:15px 18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;"><h2 class="text-[14px] font-bold">Aging dos Findings Abertos</h2></div>
    <div class="bar-in bandbar" style="display:flex;gap:2px;height:10px;border-radius:3px;overflow:hidden;background:var(--chart-track);margin-bottom:11px;">${segs}</div>
    <div style="display:flex;flex-wrap:wrap;gap:18px;">${legend}</div>
  </div>`;
}
/* Faixa compacta, Distribuição por tier. Segmentos e legenda clicáveis (dimensão tiers). */
function tierBand(list){
  const data=[1,2,3].map(t=>({t,n:list.filter(x=>x.tier===t).length}));
  const total=Math.max(1,data.reduce((a,d)=>a+d.n,0));
  const cols=['#3B6FE0','#6E5AE0','#C22F3D'];
  const hasSel=FF.tiers.length>0;
  const segs=data.map((d,i)=>{if(!d.n)return '';const sel=FF.tiers.includes(d.t);return `<div class="band-seg${sel?' sel':''}" tabindex="0" role="button" aria-pressed="${sel}" aria-label="Tier ${d.t}, ${d.n} findings${sel?', selecionado':''}" title="Tier ${d.t}: ${d.n}" style="--segc:${cols[i]};width:${(d.n/total*100).toFixed(1)}%;background:${cols[i]};${hasSel&&!sel?'opacity:.3;':''}" onclick="onDimClick(event,'tiers',${d.t})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onDimClick(event,'tiers',${d.t});}"></div>`;}).join('');
  const legend=data.map((d,i)=>{const sel=FF.tiers.includes(d.t);return `<span class="band-leg${sel?' sel':''}" role="button" tabindex="0" aria-pressed="${sel}" aria-label="Tier ${d.t}, ${d.n} findings${sel?', selecionado':''}" style="--segc:${cols[i]};display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);${hasSel&&!sel?'opacity:.4;':''}" onclick="onDimClick(event,'tiers',${d.t})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onDimClick(event,'tiers',${d.t});}"><span style="width:8px;height:8px;flex-shrink:0;background:${cols[i]};"></span>Tier ${d.t} <span class="disp" style="font-weight:900;color:#fff;">${d.n}</span></span>`;}).join('');
  return `<div class="stat-card chart-in" style="padding:15px 18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;"><h2 class="text-[14px] font-bold">Distribuição por Tier</h2></div>
    <div class="bar-in bandbar" style="display:flex;gap:2px;height:10px;border-radius:3px;overflow:hidden;background:var(--chart-track);margin-bottom:11px;">${segs}</div>
    <div style="display:flex;flex-wrap:wrap;gap:18px;">${legend}</div>
  </div>`;
}
function metaBands(list){return `<div style="display:grid;grid-template-columns:1fr 360px;gap:16px;margin-bottom:22px;">${agingBand(list)}${tierBand(list)}</div>`;}
function findingsChartsBand(list,scoped){
  return `<div class="fcharts">
    ${fChartCard('01','Risco por Repositório',chartRepoBody(list))}
    ${fChartCard('02','Top Categorias de Vulnerabilidade',chartCategoryBody(list))}
    ${fChartCard('03','Findings Abertos vs. Remediados',chartOpenVsRemedBody(scoped||list),periodNoteLabel())}
  </div>
  ${metaBands(list)}`;
}
function syncFindingsBadge(){const b=document.getElementById('findings-badge');if(b)b.textContent=openFindings().length;}

function activeChipsBar(scopedCount){
  if(!ffAnyActive())return '';
  const chips=[];
  const esc=v=>String(v).replace(/'/g,"\\'");
  const add=(k,dim,val,label)=>chips.push(`<button class="fchip" onclick="removeChipFilter('${dim}',${typeof val==='number'?val:`'${esc(val)}'`})"><span class="fchip-k">${k}</span><span class="fchip-v">${label}</span><span class="fchip-x">×</span></button>`);
  FF.repositorios.forEach(v=>add('REPO','repositorios',v,v));
  FF.categorias.forEach(v=>add('CATEGORIA','categorias',v,v));
  FF.severidades.forEach(v=>add('SEV','severidades',v,v));
  FF.scanners.forEach(v=>add('SCANNER','scanners',v,v.toUpperCase()));
  FF.tiers.forEach(v=>add('TIER','tiers',v,'Tier '+v));
  FF.faixaAging.forEach(v=>add('AGING','faixaAging',v,AGING_LABELS[v]||v));
  if(FF.busca)chips.push(`<button class="fchip" onclick="setBusca('')"><span class="fchip-k">BUSCA</span><span class="fchip-v">${FF.busca}</span><span class="fchip-x">×</span></button>`);
  if(periodPreset()!=='90'){const pl=periodPreset()==='all'?'Tudo':periodPreset()==='7'?'7 dias':periodPreset()==='30'?'30 dias':'Personalizado';chips.push(`<button class="fchip" onclick="setPeriod('90')"><span class="fchip-k">PERÍODO</span><span class="fchip-v">${pl}</span><span class="fchip-x">×</span></button>`);}
  return `<div class="filtbar">
    <span class="filtbar-count"><b>${scopedCount}</b> de ${FINDINGS.length} findings</span>
    <div class="filtbar-chips">${chips.join('')}</div>
    <button class="filtbar-clear" onclick="clearFindingFilters()">Limpar todos</button>
  </div>`;
}

function renderFindings(){
  const scoped=applyScope();
  const list0=scoped.filter(x=>FF.status==='resolved'?x.status==='resolved':x.status!=='resolved');
  let list=list0.slice();
  const remediados=scoped.filter(x=>x.status==='resolved').length;
  const dir=findingsSort.dir==='asc'?1:-1;
  list.sort((a,b)=>{
    let av,bv;
    if(findingsSort.col==='tier'){av=a.tier;bv=b.tier;}
    else if(findingsSort.col==='when'){av=new Date(a.created_at).getTime();bv=new Date(b.created_at).getTime();}
    else {av=SEV_ORDER[a.severity]||0;bv=SEV_ORDER[b.severity]||0;}
    return (av-bv)*dir;
  });

  const srcs=['trufflehog','semgrep','trivy','prowler','zap'];
  window.currentFindingIds=list.map(x=>x.id);
  const sevChips=['critical','high','medium','low','info'].map(s=>{const on=FF.severidades.includes(s);const c=sevColor(s);const style=on?`--c:${c};background:${hexA(c,.12)};border-color:${hexA(c,.4)};color:${c};`:`--c:${c};`;return `<button class="chip${on?' on':''}" style="${style}" onclick="onDimClick(event,'severidades','${s}')"><span class="chip-dot" style="background:${c};"></span>${s}${on?'<span class="chip-x">\u00d7</span>':''}</button>`;}).join('');
  const srcChips=srcs.map(s=>{const on=FF.scanners.includes(s);return `<button class="chip${on?' on':''}" onclick="onDimClick(event,'scanners','${s}')">${s}${on?'<span class="chip-x">\u00d7</span>':''}</button>`;}).join('');
  const tierChips=[1,2,3].map(t=>{const on=FF.tiers.includes(t);return `<button class="chip${on?' on':''}" onclick="onDimClick(event,'tiers',${t})">Tier ${t}${on?'<span class="chip-x">\u00d7</span>':''}</button>`;}).join('');

  const rows=list.map(fn=>`
  <tr class="rowlink" onclick="openFinding('${fn.id}')">
    <td>${sevBadge(fn.severity)}</td>

  else if(fn.cwe_id){const num=(fn.cwe_id.match(/\d+/)||[''])[0];idLink=`<a href="https://cwe.mitre.org/data/definitions/${num}.html" target="_blank" rel="noopener" class="lnk-ext">${fn.cwe_id} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-1px;"><path d="M14 4h6v6M20 4l-9 9M17 13v6a1 1 0 01-1 1H5a1 1 0 01-1-1V8a1 1 0 011-1h6"/></svg></a>`;}

  </div>`;
  } else {

  }

  document.getElementById('panel').innerHTML=`
  <div style="display:flex;flex-direction:column;height:100%;">

        <span class="text-[12px] text-fg-dim ml-2">${idx+1} de ${ids.length}</span>
      </div>
      <button onclick="closePanel()" class="drawer-nav" title="Fechar (Esc)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:24px;">
      <div class="flex items-center gap-2 mb-4">${sevBadge(fn.severity)}${fn.secret_verified?`<span class="mono text-[9px] px-1.5 py-0.5" style="color:#ef4444;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);border-radius:999px;">Verified Secret</span>`:''}</div>
      <h2 style="font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px;">${fn.title}</h2>

        ${metaItem('CVE / CWE',idLink)}

  document.getElementById('panel').classList.add('open');

function navFinding(dir){
  const ids=window.currentFindingIds||[];
  const i=ids.indexOf(window.currentFindingId);
  const ni=i+dir;
  if(ni<0||ni>=ids.length)return;
  openFinding(ids[ni]);
}
function openRemFromFinding(remId){
  closePanel();
  window.highlightRem=remId;
  navigate('remediations');
  setTimeout(()=>{
    const el=document.getElementById('rem-'+remId);
    if(el){el.scrollIntoView({block:'center'});el.style.transition='box-shadow .3s';el.style.boxShadow='0 0 0 2px #c22f3d';setTimeout(()=>{el.style.boxShadow='';},1600);}
  },80);
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* Shared diff block: GitHub-style header (file path + change count) + body */
function diffBlock(patch,filePath){
  let add=0,rem=0;
  const body=patch.split('\n').map(l=>{
    if(l.startsWith('+')){add++;return `<span class="diff-add">${escHtml(l)}</span>`;}
    if(l.startsWith('-')){rem++;return `<span class="diff-rem">${escHtml(l)}</span>`;}
    return `<span style="color:var(--text-dim);">${escHtml(l)}</span>`;
  }).join('\n');
  const hdr=`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-page);border:1px solid var(--border-default);border-bottom:none;border-radius:6px 6px 0 0;padding:6px 10px;">
    <span class="mono" style="font-size:11px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;overflow:hidden;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${filePath||'patch'}</span></span>
    <span class="mono" style="font-size:11px;flex-shrink:0;margin-left:10px;"><span style="color:var(--sev-safe);">+${add}</span> <span style="color:var(--sev-critical);">−${rem}</span></span>
  </div>`;
  return `${hdr}<pre style="background:var(--bg-page);border:1px solid var(--border-default);border-radius:0 0 6px 6px;padding:12px;overflow-x:auto;font-size:11.5px;line-height:1.7;margin:0;">${body}</pre>`;
}
/* Shared rotation-procedure block (neutral surface, amber left-border) */
function rotationBlock(instructions){
  const monoIds=s=>escHtml(s).replace(/\b([A-Z][A-Z0-9_\/]{6,})\b/g,'<span class="mono">$1</span>');
  let steps='';
  if(instructions){
    steps='<ol style="margin:8px 0 0;padding-left:20px;list-style:decimal;">'+
      instructions.replace(/\\n/g,'\n').split('\n').map(l=>l.replace(/^\d+\.\s*/,'').trim()).filter(Boolean)
      .map(l=>`<li style="font-size:12.5px;color:var(--text-primary);line-height:1.5;margin-bottom:4px;padding-left:2px;">${monoIds(l)}</li>`).join('')+'</ol>';
  }
  return `<div style="background:var(--bg-surface);border:1px solid var(--border-default);border-left:3px solid #eab308;border-radius:6px;padding:10px 12px;margin:10px 0;display:flex;gap:9px;align-items:flex-start;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><div style="min-width:0;"><div style="font-size:13px;font-weight:600;color:var(--text-primary);">Rotação de credencial necessária</div>${steps||'<div style="font-size:12px;color:var(--text-secondary);margin-top:1px;">Este secret foi verificado, rotacione a credencial antes de aplicar o patch.</div>'}</div></div>`;
}
function metaItem(k,v){return `<div style="background:var(--bg-surface);border:1px solid var(--border-default);border-radius:6px;padding:8px 10px;"><div style="font-size:13px;font-weight:400;color:var(--text-secondary);margin-bottom:3px;">${k}</div><div style="font-size:12.5px;font-weight:500;color:var(--text-primary);">${v}</div></div>`;}
function metaItemBadge(k,crit){return `<div style="background:var(--bg-surface);border:1px solid var(--border-default);border-radius:6px;padding:8px 10px;"><div style="font-size:13px;font-weight:400;color:var(--text-secondary);margin-bottom:5px;">${k}</div>${crit?sevBadge(crit):'<span style="font-size:12.5px;color:var(--text-primary);">—</span>'}</div>`;}
function closePanel(){const _p=document.getElementById('panel');if(_p)_p.classList.remove('open');const _o=document.getElementById('overlay');if(_o)_o.classList.remove('open');}

/* ═══════════════════════ SCREEN: PIPELINES ═══════════════════════ */
let pipelineInterval=null;

function riskCompact(score,level){
  if(score==null)return `<span class="mono text-[11px] text-fg-dim">${level||'—'}</span>`;
  const b=gaugeBand(score);
  return `<span class="flex items-center gap-1.5">${miniGauge(score)}<span class="mono text-[13px] font-semibold" style="color:${b.c};">${score}</span></span>`;
}
let pipelinesFilter={repo:null,status:null,tier:null};
function pipeStatus(j){
  if(j.blocked_at_tier===1||j.final_risk_level==='blocked')return 'blocked';
  if(j.tier2_status==='failed'||j.tier3_status==='failed')return 'failed';
  if(j.tier1_status==='running'||j.tier2_status==='running'||j.tier3_status==='running')return 'running';
  return 'done';
}
function pipeTierReached(j){
  if(j.tier3_status&&j.tier3_status!=='skipped')return 3;
  if(j.tier2_status&&j.tier2_status!=='skipped')return 2;
  return 1;
}
function setPipelineFilter(key,val){
  pipelinesFilter[key]=pipelinesFilter[key]===val?null:val;
  document.getElementById('app-main').innerHTML=renderPipelines();
  bindScreenEvents('pipelines');
}
function clearPipelineFilters(){pipelinesFilter={repo:null,status:null,tier:null};document.getElementById('app-main').innerHTML=renderPipelines();bindScreenEvents('pipelines');}

function renderPipelines(){
  const pf=pipelinesFilter;
  let list=SCAN_JOBS.filter(j=>
    (!pf.repo||j.repo_full_name===pf.repo)&&
    (!pf.status||pipeStatus(j)===pf.status)&&
    (!pf.tier||pipeTierReached(j)===pf.tier)
  );
  const rows=list.map(j=>{
    const hasRunning=j.tier1_status==='running'||j.tier2_status==='running'||j.tier3_status==='running';
    const isBlocked=j.blocked_at_tier!=null&&j.final_risk_level!=='blocked'||j.final_risk_level==='blocked';
    return `<div class="stat-card card-link mb-3" style="cursor:pointer;" onclick="openInsights('${j.id}')">
    <div class="flex items-center justify-between mb-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold text-[15px]">${j.repo_full_name}</span>
          <span class="mono text-[10px] text-fg-dim">PR #${j.pr_number}</span>
          ${hasRunning?`<span class="sev st-running" style="gap:4px;"><svg class="spin" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 11-9-9"/></svg>em execução</span>`:''}
          ${isBlocked&&j.final_risk_level==='blocked'?`<span class="sev st-blocked">gate1 bloqueado</span>`:''}
        </div>
        <div class="text-[12px] text-fg-dim mt-0.5"><span class="mono">commit ${shortSha(j.commit_sha)}</span> · ${timeTag(j.created_at)}</div>
      </div>
      ${riskCompact(j.final_risk_score,j.final_risk_level)}
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-default);"><div style="max-width:700px;">${tierStepper(j)}</div></div>
  </div>`;
  }).join('');

  const repos=[...new Set(SCAN_JOBS.map(j=>j.repo_full_name))];
  const repoChips=repos.map(rp=>`<button class="chip${pf.repo===rp?' on':''}" style="text-transform:none;" onclick="setPipelineFilter('repo','${rp}')">${rp.split('/')[1]||rp}${pf.repo===rp?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');
  const statusOpts=[['done','Concluído'],['running','Em execução'],['failed','Falhou'],['blocked','Bloqueado']];
  const statusChips=statusOpts.map(([v,l])=>`<button class="chip${pf.status===v?' on':''}" onclick="setPipelineFilter('status','${v}')">${l}${pf.status===v?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');
  const tierChips=[1,2,3].map(t=>`<button class="chip${pf.tier===t?' on':''}" onclick="setPipelineFilter('tier',${t})">Tier ${t}${pf.tier===t?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');
  const anyFilter=pf.repo||pf.status||pf.tier;

  const runningCount=SCAN_JOBS.filter(j=>pipeStatus(j)==='running').length;
  return `<div class="page-wrap">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-[24px] font-bold tracking-tight">Scans <span class="text-[14px] text-fg-mute font-normal">${SCAN_JOBS.length} no total</span></h1>
      <p class="text-fg-dim text-[13px] mt-1">Execuções dos repositórios monitorados${runningCount>0?` · ${runningCount} em execução`:''}</p>
    </div>
    <div class="flex items-center gap-2">
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-secondary);"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse-safe 2s infinite;"></span>Atualização automática</span>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-wrap mb-4">
    ${repoChips}
    <div class="w-px h-6 bg-line mx-1"></div>
    ${statusChips}
    <div class="w-px h-6 bg-line mx-1"></div>
    ${tierChips}
    ${anyFilter?`<button class="chip chip-clear" onclick="clearPipelineFilters()">Limpar filtros</button>`:''}
  </div>

function startPipelinePolling(){
  if(pipelineInterval)clearInterval(pipelineInterval);
  let tick=0;
  pipelineInterval=setInterval(()=>{
    tick++;
    if(currentScreen!=='pipelines'){clearInterval(pipelineInterval);return;}
    // simulate T3 completing for s2
    if(tick===4){SCAN_JOBS[1].tier3_status='done';SCAN_JOBS[1].final_risk_score=412;SCAN_JOBS[1].final_risk_level='high';SCAN_JOBS[1].t3_dur='9m';}
    document.getElementById('app-main').innerHTML=renderPipelines();
  },3000);
}

    st.classList.add('lit');
    const c=st.querySelector('.ap-conn');
    if(c){c.classList.add('filled');if(st.dataset.sev==='critical')c.classList.add('crit');}
  });
  if(prog)prog.style.display='none';
}
function playAttackChain(force){
  const chain=document.getElementById('ap-chain');
  const steps=[...document.querySelectorAll('#ap-chain .ap-step')];
  if(!steps.length)return;
  const prog=document.getElementById('ap-progress');
  apTimers.forEach(clearTimeout);apTimers=[];
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    if(chain)chain.classList.remove('animate');
    apSetStatic(steps,prog);
    steps[steps.length-1].classList.add('climax');
    return;
  }
  if(chain)chain.classList.add('animate');
  steps.forEach(st=>{
    st.classList.remove('lit','climax');
    const c=st.querySelector('.ap-conn');
    if(c)c.classList.remove('filled','crit');
  });
  if(prog){prog.style.display='';prog.textContent='Passo 1 de '+steps.length;}
  let critCount=0;
  steps.forEach((st,i)=>{
    apTimers.push(setTimeout(()=>{
      st.classList.add('lit');
      if(i===steps.length-1)st.classList.add('climax');
      if(prog)prog.textContent='Passo '+(i+1)+' de '+steps.length;
      const c=st.querySelector('.ap-conn');
      if(c)apTimers.push(setTimeout(()=>{
        c.classList.add('filled');
        if(st.dataset.sev==='critical'){
          const sh=c.querySelector('.shim');
          if(sh)sh.style.animationDelay=(critCount++*3)+'s';
          c.classList.add('crit');
        }
      },550));
    },i*1200));
  });
  apTimers.push(setTimeout(()=>{if(prog)prog.style.display='none';},steps.length*1200+500));
}
function apObserve(){
  const chain=document.getElementById('ap-chain');
  if(!chain)return;
  apPlayed=false;
  const fire=()=>{if(!apPlayed){apPlayed=true;playAttackChain();}};
  // If already in view, play on next frame; else observe.
  const r=chain.getBoundingClientRect();
  if(r.top<window.innerHeight&&r.bottom>0){requestAnimationFrame(fire);return;}
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting&&!apPlayed){obs.disconnect();fire();}
    });
  },{threshold:.15});
  obs.observe(chain);
}

  ico.querySelector('path').setAttribute('d',col?'M9 6l6 6-6 6':'M15 6l-6 6 6 6');
  btn.title=col?'Expandir sidebar':'Recolher sidebar';
  localStorage.setItem('aperia-sb-col',col);
}

/* ═══════════════════════ INIT ═══════════════════════ */
(function(){
  if(localStorage.getItem('aperia-sb-col')==='true'){
    const sb=document.getElementById('sb'),shell=document.getElementById('app-shell'),ico=document.getElementById('sb-tgl-ico'),btn=document.getElementById('sb-tgl');
    if(sb&&shell){sb.classList.add('sb-c');shell.style.gridTemplateColumns='64px 1fr';if(ico)ico.querySelector('path').setAttribute('d','M15 6l-6 6 6 6');if(btn)btn.title='Expandir sidebar';const w=document.getElementById('sb-expand-wrap');if(w)w.style.display='flex';}
  }
  const saved=localStorage.getItem('aperia-screen')||'home';
  navigate(saved);
  document.addEventListener('keydown',e=>{
    const open=document.getElementById('panel').classList.contains('open');
    if(!open)return;
    if(e.key==='Escape'){closePanel();}
    else if(e.key==='ArrowDown'){e.preventDefault();navFinding(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();navFinding(-1);}
  });
})();
</script>

  componentDidMount(){
    this.svg = this.svgRef.current;
    this.buildFindings(); this.buildDust(); this.buildPour();
    this.t0 = null; this._alive = true; this.visible = true; this._prCycle = -1;
    this.io = new IntersectionObserver((es)=>{ this.visible = es[0].isIntersecting; }, {threshold:0.02});
    this.io.observe(this.rootRef.current);
    this.setVerdict(true);
    if(this.reduce()){ this.renderStatic(); return; }
    this.raf = requestAnimationFrame(this.tick);
  }
  componentWillUnmount(){ this._alive=false; if(this.raf)cancelAnimationFrame(this.raf); if(this.io)this.io.disconnect(); }

  ns(tag){ return document.createElementNS('http://www.w3.org/2000/svg',tag); }
  buildFindings(){
    const g = this.svg.querySelector('#findings'); this.findings = [];
    this.TOOLS.forEach((t)=>{
      const el = this.ns('g'); el.setAttribute('opacity','0');
      const w = 22 + t.n.length*7.2;
      el.innerHTML = `<rect x="${-w/2}" y="-13" width="${w}" height="26" rx="13" fill="#12151b" stroke="#2b303b" stroke-width="1"/>`+
        `<circle cx="${-w/2+13}" cy="0" r="4" fill="${t.sev}"/>`+
        `<text x="${-w/2+24}" y="4" font-family="'JetBrains Mono',monospace" font-size="11" fill="#c3c8d2">${t.n}</text>`;
      g.appendChild(el); this.findings.push({el, x:t.x, y:t.y});
    });
  }
  buildPour(){
    const g=this.svg.querySelector('#pour'); this.pour=[]; const G='01{}</>x$;=+#λ!?&|~10';
    for(let i=0;i<64;i++){ const t=this.ns('text');
      t.setAttribute('font-family',"'JetBrains Mono',monospace");
      t.setAttribute('font-size',(7.5+Math.random()*5).toFixed(1));
      t.setAttribute('text-anchor','middle');
      t.setAttribute('fill', Math.random()<0.5?'#c0403f':'#6b7280');
      t.textContent=G[Math.floor(Math.random()*G.length)];
      g.appendChild(t);
      this.pour.push({el:t, ox:168+(Math.random()*2-1)*118, ph:Math.random(), sp:40+Math.random()*54}); }
  }
  buildDust(){
    const g = this.svg.querySelector('#dust'); this.dust=[];
    for(let i=0;i<14;i++){ const c=this.ns('rect'); const x=682+Math.random()*156, s=1.4+Math.random()*2.2;
      c.setAttribute('x',x); c.setAttribute('y',470); c.setAttribute('width',s); c.setAttribute('height',s);
      g.appendChild(c); this.dust.push({el:c, base:470, spd:26+Math.random()*54, ph:Math.random()}); }
  }

  clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  seg(t,a,b){return this.clamp((t-a)/(b-a),0,1);}
  lerp(a,b,t){return a+(b-a)*t;}
  eio(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  bump(t){return Math.sin(Math.PI*this.clamp(t,0,1));}
  set(id,attr,val){ const e=this.svg.querySelector(id); if(e)e.setAttribute(attr,val); }
  op(id,v){ const e=this.svg.querySelector(id); if(e)e.style.opacity=v; }
  cap(txt){ const c=this.capRef.current; if(c&&c.textContent!==txt) c.textContent=txt; }

  cubeFrontPath(b){
    const L=650,R=870,T=250,B=470;
    return `M${L} ${T} Q${(L+R)/2} ${T-b} ${R} ${T} Q${R+b} ${(T+B)/2} ${R} ${B} Q${(L+R)/2} ${B+b} ${L} ${B} Q${L-b} ${(T+B)/2} ${L} ${T} Z`;
  }

  tick = (now)=>{
    if(!this._alive) return;
    if(this.t0==null) this.t0=now;
    if(this.visible && document.body.style.overflow!=='hidden') this.frame((now-this.t0)/1000);
    this.raf = requestAnimationFrame(this.tick);
  };

  frame(elapsed){
    const tt = elapsed % this.DUR;
    const cyc = Math.floor(elapsed/this.DUR);
    const L=this;

    const push6 = L.bump(L.seg(tt,7.2,9.6));

    // CACHOEIRA de findings despejando no caixote (mar de sinais)
    if(L.pour){ const top=64, mouth=430, rng=400;
      for(const q of L.pour){ const y=top+((elapsed*q.sp+q.ph*rng)%rng); const prog=L.clamp((y-top)/(mouth-top),0,1);
        const x=L.lerp(q.ox,168,prog*prog); const o=(y>mouth?0:L.clamp(Math.min((y-top)/40,(mouth-y)/48),0,1)*0.8);
        q.el.setAttribute('x',x.toFixed(1)); q.el.setAttribute('y',y.toFixed(1)); q.el.setAttribute('opacity',o.toFixed(3)); } }

    // CAT anda: centro -> caixote (pega) -> sandbox (deposita) -> contém/clímax -> volta
    let catX=430, face=1, moving=false;
    if(tt<0.2){ catX=430; }
    else if(tt<1.6){ catX=L.lerp(430,280,L.eio(L.seg(tt,0.2,1.6))); face=-1; moving=true; }
    else if(tt<2.5){ catX=280; face=-1; }
    else if(tt<4.1){ catX=L.lerp(280,566,L.eio(L.seg(tt,2.5,4.1))); face=1; moving=true; }
    else if(tt<10.2){ catX=566; face=1; }
    else if(tt<11.8){ catX=L.lerp(566,430,L.eio(L.seg(tt,10.2,11.8))); face=1; moving=true; }
    const idle=Math.sin(elapsed*1.5)*1.3, bob=moving?Math.abs(Math.sin(elapsed*9))*-3:0;
    L.set('#cat','transform',`translate(${catX},${-18+push6*3+idle+bob}) translate(20,0) scale(${face},1) translate(-20,0)`);
    const step=moving?Math.sin(elapsed*9)*5:0;
    L.set('#catLegL','transform',`translate(0,${step.toFixed(2)})`);
    L.set('#catLegR','transform',`translate(0,${(-step).toFixed(2)})`);
    L.set('#catRed','opacity',(push6*0.2).toFixed(3));
    L.set('#catArm','stroke-width',(17+push6*3).toFixed(1));
    // detalhes cyber: scanline varre o visor, antena pulsa
    const scanX = -38 + ((elapsed*46)%88);
    L.set('#catScan','x', scanX.toFixed(1));
    L.set('#catScan','opacity', (0.35+0.4*Math.abs(Math.sin(elapsed*3))).toFixed(3));
    L.set('#catAntenna','opacity', (0.4+0.6*(Math.sin(elapsed*5)*0.5+0.5)).toFixed(3));

    // FINDINGS: o gato pega no caixote e leva à sandbox
    const bmX=168, bmY=430, slotX=760, slotY=244;
    L.findings.forEach((f,i)=>{
      let x,y,o=0; const pk0=1.7+i*0.05, pk1=2.5, dp0=4.1+i*0.14, dp1=4.9+i*0.14;
      if(tt<pk0){ x=bmX; y=bmY; o=0; }
      else if(tt<pk1){ const q=L.eio(L.seg(tt,pk0,pk1)); x=L.lerp(bmX,262,q); y=L.lerp(bmY,412+i*9,q)-Math.sin(q*Math.PI)*20; o=1; }
      else if(tt<dp0){ x=catX-42; y=412+i*9; o=1; }
      else if(tt<dp1){ const q=L.eio(L.seg(tt,dp0,dp1)); x=L.lerp(548,slotX,q); y=L.lerp(412+i*9,slotY,q)-Math.sin(q*Math.PI)*76; o=q<0.9?1:0; }
      else { x=bmX; y=bmY; o=0; }
      f.el.setAttribute('transform',`translate(${x},${y})`);
      f.el.setAttribute('opacity', o.toFixed(3));
    });

    // CUBE close (p3) ... reopen near end for continuity
    const close = L.eio(L.seg(tt,3.8,4.8));
    const reopen = L.eio(L.seg(tt,11.2,12.0));
    let lift = 0; // câmara sempre selada (entra pelo topo, sai por baixo)
    L.set('#cubeFront','transform',`translate(0,${lift})`);
    L.set('#cubeFrontDetail','transform',`translate(0,${lift})`);

    // CUBE eyes: open after close, close again at very end
    const eyeOpen = L.seg(tt,4.7,5.1);
    const eyeClose = L.seg(tt,11.0,11.8);
    const eyeAmt = L.clamp(eyeOpen-eyeClose,0,1);
    L.op('#cubeEyes', eyeAmt.toFixed(3));
    const squint = 1-push6*0.6;
    L.set('#ceL','transform',`translate(${push6*3},0) scale(1,${(0.4+0.6*eyeAmt)*squint})`);
    L.set('#ceR','transform',`translate(${push6*3},0) scale(1,${(0.4+0.6*eyeAmt)*squint})`);

    // CREATURE awaken + breathe, fade out at end (0 at both ends => continuous)
    const awaken = L.clamp(L.seg(tt,5.6,7.0)-L.seg(tt,9.6,11.0),0,1);
    const breathe = Math.sin(elapsed*3.4)*0.5+0.5;
    L.op('#creature',(awaken*0.92).toFixed(3));
    L.set('#creGlow','opacity',L.clamp(awaken*(0.35+0.25*breathe)+push6*0.5,0,1).toFixed(3));
    const cs=1+breathe*0.05+push6*0.12;
    L.set('#creGlow','transform',`translate(760,372) scale(${cs}) translate(-760,-372)`);
    // criatura viva: tentáculos ondulam, garras se mexem, olhos piscam e rastreiam a pressão
    if(awaken>0.02){
      const sway=Math.sin(elapsed*1.7), sway2=Math.sin(elapsed*1.35+1.4);
      L.set('#tent1','transform',`rotate(${sway*4} 706 468) translate(${sway*3},0)`);
      L.set('#tent2','transform',`rotate(${-sway2*4} 828 468) translate(${sway2*3},0)`);
      const cl=Math.sin(elapsed*2.6);
      L.set('#claw1','transform',`translate(${cl*3},${cl*2}) rotate(${cl*4} 728 340)`);
      L.set('#claw2','transform',`translate(${-cl*3},${-cl*2}) rotate(${-cl*4} 786 336)`);
      const blink=(Math.sin(elapsed*0.8)>0.93||Math.sin(elapsed*1.9+2)>0.97)?0.12:1;
      L.set('#creEyeL','ry',(9*blink).toFixed(2)); L.set('#creEyeR','ry',(9*blink).toFixed(2));
      const look=Math.sin(elapsed*1.1)*3;
      L.set('#creEyeL','transform',`translate(${push6*4+look},${-push6*3})`);
      L.set('#creEyeR','transform',`translate(${push6*4+look},${-push6*3})`);
    }

    // CLIMAX: bulge + cracks + escaping light + dust + floor dip
    // caixa "respira" quando algo vivo desperta dentro; deforma forte no clímax
    const breath = awaken*(2.4+2.6*Math.sin(elapsed*2.2));
    L.set('#cubeFront','d',L.cubeFrontPath(push6*34 + breath));
    L.set('#cubeFrontDetail','opacity',(1-push6*0.15).toFixed(3));
    L.op('#cracks',(L.seg(tt,7.4,8.6)*push6*1.2).toFixed(3));
    L.op('#cracksHot',(L.seg(tt,7.6,8.6)*push6).toFixed(3));
    L.set('#escape','opacity',(Math.min(1,push6*0.85+awaken*0.16*breathe)).toFixed(3));
    L.set('#escape','transform',`translate(760,360) scale(${0.7+push6*0.5}) translate(-760,-360)`);
    L.set('#rim','opacity',(0.42+push6*0.5).toFixed(3));
    L.set('#floorLine','transform',`translate(0,${push6*3})`);

    // SANDBOX treme e quase explode enquanto emula (jitter + micro-rotação sobre o centro)
    const emu = L.clamp(L.seg(tt,5.6,7.2),0,1);
    const trem = Math.max(emu*0.45, push6);
    const jx = Math.sin(elapsed*53)*4.5*trem, jy = Math.cos(elapsed*61)*4*trem;
    const rot = Math.sin(elapsed*47)*1.1*trem;
    L.set('#cubeShake','transform',`rotate(${rot.toFixed(3)} 760 360) translate(${jx.toFixed(2)} ${jy.toFixed(2)})`);
    L.set('#cubeShadow','opacity',(0.55-push6*0.18).toFixed(3));
    L.op('#dust',push6>0.15?'1':'0');
    if(push6>0.15) L.dust.forEach(d=>{ const p=((elapsed*d.spd/60)+d.ph)%1; d.el.setAttribute('y',(d.base+p*70).toFixed(1)); d.el.setAttribute('opacity',(push6*(1-p)*0.7).toFixed(3)); });

    // PR nasce de um brilho de salvação e sai pela fenda
    const flash = L.bump(L.seg(tt,10.2,11.2));
    L.set('#prFlash','opacity',(flash*0.95).toFixed(3));
    L.set('#prFlash','transform',`translate(760,476) scale(${(0.5+flash*0.8).toFixed(3)}) translate(-760,-476)`);
    L.op('#prRays',(flash*0.55).toFixed(3));
    L.set('#prRays','transform',`rotate(${(flash*8).toFixed(2)} 760 476) scale(1,${(0.4+flash*0.9).toFixed(3)})`);
    const prIn = L.eio(L.seg(tt,10.6,11.5));
    const prOut = L.seg(tt,11.9,12.0);
    L.op('#pr',L.clamp(prIn-prOut,0,1).toFixed(3));
    L.set('#pr','transform',`translate(760,${L.lerp(452,500,prIn)}) scale(${(0.82+0.18*prIn).toFixed(3)})`);
    if(prIn>0.02 && this._prCycle!==cyc){ this._prCycle=cyc; this.setVerdict(cyc%2===0); }

    // captions
    L.cap('');
  }

  setVerdict(exploitable){
    const g=this.svg.querySelector('#prVerdict'); if(!g)return;
    const bar=this.svg.querySelector('#prBar');
    if(bar){ let b=''; let x=-90; for(let i=0;i<34;i++){ const w=1+((i*7)%3); if(i%2===0) b+=`<rect x="${x}" y="132" width="${w}" height="12"/>`; x+=w+1.4; } bar.innerHTML=b; }
    if(exploitable){
      g.innerHTML = `<rect x="-90" y="62" width="180" height="40" rx="4" fill="#fbe9e9" stroke="#e5333b" stroke-width="1.5"/>`+
        `<circle cx="-71" cy="82" r="10" fill="#e5333b"/>`+
        `<path d="M-76 82 l3.5 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
        `<text x="-54" y="79" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#7a1518">EXPLOITABLE</text>`+
        `<text x="-54" y="94" font-family="'JetBrains Mono',monospace" font-size="9" fill="#c0403f">proof attached · merge recommended</text>`+
        `<text x="-90" y="120" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#8a8578">reproducible in sandbox · signed</text>`;
    } else {
      g.innerHTML = `<rect x="-90" y="62" width="180" height="40" rx="4" fill="#edeef0" stroke="#9aa1ac" stroke-width="1.5"/>`+
        `<circle cx="-71" cy="82" r="10" fill="#6b7280"/>`+
        `<path d="M-75 78 l8 8 M-67 78 l-8 8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>`+
        `<text x="-54" y="79" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#3a3f48">FALSE POSITIVE</text>`+
        `<text x="-54" y="94" font-family="'JetBrains Mono',monospace" font-size="9" fill="#8a909a">exploit not reproducible</text>`+
        `<text x="-90" y="120" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#a49f90">no viable path · closed</text>`;
    }
  }

  renderStatic(){
    this.set('#cubeFront','transform','translate(0,0)');
    this.set('#cubeFrontDetail','transform','translate(0,0)');
    this.op('#cubeEyes','1'); this.op('#creature','0.5'); this.set('#creGlow','opacity','0.3');
    this.findings.forEach(f=>f.el.setAttribute('opacity','0'));
    this.op('#pr','1'); this.set('#pr','transform','translate(760,236)'); this.setVerdict(true);
    this.cap('do sinal à prova');
  }

  renderVals(){ return { rootRef:this.rootRef, svgRef:this.svgRef, capRef:this.capRef }; }
}
</script>

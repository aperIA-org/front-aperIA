<!doctype html>
<html lang="pt-BR" data-screen-label="aperIA Dashboard">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aperIA · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    fontFamily: { sans: ['"Open Sans"','"Helvetica Neue"','Arial','sans-serif'], mono: ['"JetBrains Mono"','ui-monospace','monospace'] },
    extend: {
      colors: {
        ink:      {50:'#f2f2f2',100:'#d0d0d0',200:'#a1a1a1',300:'#707070',400:'#707070',500:'#202124',600:'#1f2023',700:'#17181a',800:'#17181a',900:'#0c0d0f'},
        crimson:  {50:'#fff1f1',100:'#ffd7d7',200:'#ffa3a3',300:'#ff6b6b',400:'#ef3a3a',500:'#d81f2a',600:'#b81620',700:'#8d0e16',800:'#5a070d',900:'#2b0306'},
        severity: {critical:'#ff2d3d',high:'#ff6a3d',medium:'#f5a524',low:'#f5d524',info:'#4aa3ff',safe:'#2ecc8b'},
        surface:  {DEFAULT:'#17181a',1:'#17181a',2:'#1f2023',deep:'#0c0d0f'},
        fg:       {DEFAULT:'#f2f2f2',mute:'#a1a1a1',dim:'#707070'},
        line:     {DEFAULT:'#202124',strong:'#4a4b4d'},
        brand:    {DEFAULT:'#d81f2a',hov:'#b81620'},
      },
      borderRadius: {xs:'3px',sm:'6px',md:'10px',lg:'12px',xl:'14px'},
      transitionDuration: {fast:'140ms',base:'220ms'},
      boxShadow: {
        'el-1':'0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.5)',
        'el-2':'0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -10px rgba(0,0,0,.7)',
        'el-3':'0 1px 0 rgba(255,255,255,.05) inset,0 24px 48px -18px rgba(0,0,0,.85)',
        'glow-red':'0 0 0 1px rgba(216,31,42,.4),0 0 32px -4px rgba(216,31,42,.45)',
        'ring-focus':'0 0 0 2px #d81f2a,0 0 0 4px rgba(216,31,42,.25)',
      },
    },
  },
};
</script>
<style>
body{font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;}
.mono{font-family:"Geist Mono",ui-monospace,monospace;}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,58,58,.6);}50%{box-shadow:0 0 0 4px rgba(239,58,58,0);}}
@keyframes pulse-safe{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 4px rgba(34,197,94,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.dot-pulse{animation:pulse-red 2s ease-in-out infinite;}
.dot-safe{animation:pulse-safe 2s ease-in-out infinite;}
.spin{animation:spin 1s linear infinite;}
@keyframes catBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes breatheGlow{0%,100%{opacity:.72;filter:blur(38px)}50%{opacity:1;filter:blur(50px)}}
@keyframes breatheEmit{0%,100%{opacity:.14}50%{opacity:.58}}
/* Sidebar */
.sb-disabled{opacity:.35;pointer-events:none;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-family:"Geist",sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;position:relative;color:rgba(255,255,255,.72);transition:background .15s,color .15s;white-space:nowrap;}
.sb-item:hover{background:rgba(255,255,255,.06);color:white;}
.sb-item.active{background:rgba(225,29,42,.16);box-shadow:inset 2.5px 0 0 #e11d2a;border-radius:0 7px 7px 0;color:#ff5a63;font-weight:600;padding-left:14px;}
.sb-item.active .sb-ico{color:#ff5a63;}
.sb-ico{display:grid;place-items:center;flex-shrink:0;width:20px;height:20px;}
.sb-lbl{flex:1;overflow:hidden;transition:opacity .2s;}
.sb-bdg{font-family:"Geist Mono",monospace;font-size:10px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#e11d2a;color:white;display:grid;place-items:center;flex-shrink:0;transition:opacity .2s;box-shadow:0 0 8px rgba(225,29,42,.4);}
.sb-tgl-btn:hover{background:rgba(255,255,255,.12)!important;color:rgba(255,255,255,.82)!important;}
/* Collapsed — based on v4 M3 True Black */
#sb.sb-c{width:64px!important;}
#sb.sb-c #sb-wm{display:none;}
#sb.sb-c #sb-ws-info,#sb.sb-c #sb-ws-chev{display:none;}
#sb.sb-c .sb-lbl{display:none;}
#sb.sb-c .sb-bdg{display:none;}
#sb.sb-c #sb-logo{width:48px!important;height:48px!important;}
#sb.sb-c .sb-header-inner{justify-content:center;padding:12px 7px;}
#sb.sb-c #sb-tgl{display:none!important;}
#sb.sb-c nav{padding:6px 0 20px;}
#sb.sb-c .sb-item{justify-content:center;padding:9px 0;gap:0;width:100%;}
#sb.sb-c .sb-item.active{background:rgba(216,31,42,.14);box-shadow:inset 3px 0 0 #d81f2a;border-radius:0 5px 5px 0;}
/* expand button — only visible when collapsed */
#sb-expand-btn{display:none;}
#sb.sb-c #sb-expand-btn{display:flex;}
/* workspace footer collapsed */
#sb.sb-c #sb-ws-footer{padding:6px 0;}
#sb.sb-c #sb-ws-info,#sb.sb-c #sb-ws-chev{display:none;}
#sb.sb-c #sb-ws-footer button{justify-content:center;padding:6px;}

/* Table */
.tbl-row{display:grid;align-items:center;padding:10px 16px;border-bottom:1px solid #202124;cursor:pointer;transition:background .12s;min-height:44px;}
.tbl-row:hover{background:#1f2023;}
.tbl-row:last-child{border-bottom:none;}
/* Severity badges */
:root{--sev-critical:#ff2d3d;--sev-high:#ff6a3d;--sev-medium:#f5a524;--sev-low:#f5d524;--sev-info:#4aa3ff;--sev-safe:#2ecc8b;--surface-deep:#08090c;}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.sev-fx{min-width:78px;height:auto;padding:2px 10px;justify-content:center;font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;border-radius:100px;border:none!important;color:var(--surface-deep)!important;flex-shrink:0;}
.sev-fx.sev-critical{background:var(--sev-critical);}
.sev-fx.sev-high{background:var(--sev-high);}
.sev-fx.sev-medium{background:var(--sev-medium);}
.sev-fx.sev-low{background:var(--sev-low);}
.sev-fx.sev-info{background:var(--sev-info);}
.sev-fx.sev-safe{background:var(--sev-safe);}
.sev-critical{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.25);}
.sev-high{background:rgba(249,115,22,.12);color:#f97316;border:1px solid rgba(249,115,22,.22);}
.sev-medium{background:rgba(234,179,8,.12);color:#eab308;border:1px solid rgba(234,179,8,.22);}
.sev-low{background:rgba(34,197,94,.10);color:#22c55e;border:1px solid rgba(34,197,94,.18);}
.sev-info{background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.22);}
/* Status badges */
.st-done{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.22);}
.st-running{background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.22);}
.st-failed{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.25);}
.st-skipped{background:rgba(112,112,112,.12);color:#707070;border:1px solid rgba(112,112,112,.22);}
.st-queued{background:rgba(234,179,8,.12);color:#eab308;border:1px solid rgba(234,179,8,.22);}
.st-blocked{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.25);}
/* Slide-over */
.slide-over{position:fixed;top:0;right:0;bottom:0;width:520px;background:#17181a;border-left:1px solid #202124;z-index:50;transform:translateX(100%);transition:transform .25s cubic-bezier(.22,.61,.36,1);overflow-y:auto;}
.slide-over.open{transform:translateX(0);}
.slide-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;opacity:0;display:none;pointer-events:none;transition:opacity .25s;}
.slide-overlay.open{opacity:1;display:block;pointer-events:auto;}
.card-link{transition:background .12s,border-color .12s;}
.card-link:hover{background:#1f2023;}
.metric-link:hover .metric-lbl{text-decoration:underline;}
/* ── Overview KPI tiles (tech-brutalist) ── */
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px;}
@media(max-width:1199px){.ov-grid{grid-template-columns:repeat(2,1fr);}}
.ov-tile{position:relative;padding:18px 20px 16px;background:#111214;cursor:pointer;overflow:hidden;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:13px 13px;background-position:-1px -1px;transition:transform .14s ease,background-color .14s;}
.ov-tile:hover{transform:translateY(-2px);background-color:#161719;}
.ov-tile::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--ov-accent,#d81f2a);transform:scaleX(0);transform-origin:left;transition:transform .18s ease;}
.ov-tile:hover::after{transform:scaleX(1);}
.ov-idx{position:absolute;top:14px;right:16px;font-family:"JetBrains Mono",monospace;font-size:10px;color:#3a3b3d;letter-spacing:.06em;}
.ov-mark{width:6px;height:6px;background:var(--ov-accent,#5c5c5c);margin-bottom:13px;}
.ov-lbl{font-family:"JetBrains Mono",monospace;text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:#8a8a8a;margin-bottom:9px;}
.ov-num{font-family:"Chakra Petch","JetBrains Mono",monospace;font-weight:700;font-size:52px;line-height:.9;font-variant-numeric:tabular-nums;color:#f2f2f2;}
.ov-num.is-crit{color:var(--sev-critical);text-shadow:0 0 12px rgba(255,45,61,.35);}
.ov-num.is-high{color:var(--sev-high);}
.ov-sub{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:#5c5c5c;margin-top:11px;letter-spacing:.02em;}
@media(max-width:1199px){.ov-tile:hover{transform:none;}}
.sev-row:hover{background:#1f2023;}
.sev-row:hover .sev-row-lbl{text-decoration:underline;}
.drawer-nav{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:#a1a1a1;cursor:pointer;transition:background .12s,color .12s;}
.drawer-nav:hover{background:#1f2023;color:#f2f2f2;}
.drawer-nav:disabled{opacity:.3;cursor:not-allowed;}
.lnk-ext{color:#539fe5;text-decoration:none;}
.lnk-ext:hover{text-decoration:underline;}
.exec-select{display:inline-flex;align-items:center;gap:8px;background:#17181a;border:1px solid #2e2f31;border-radius:6px;padding:6px 10px;cursor:pointer;transition:background .12s,border-color .12s;}
.exec-select:hover{background:#1f2023;border-color:#3a3b3e;}
.exec-dd{position:absolute;top:calc(100% + 6px);left:0;width:440px;max-width:90vw;background:#17181a;border:1px solid #2e2f31;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .14s,transform .14s;overflow:hidden;}
.exec-dd.open{opacity:1;pointer-events:auto;transform:translateY(0);}
.exec-dd-search{padding:8px;border-bottom:1px solid #202124;}
.exec-dd-search input{width:100%;background:#0c0d0f;border:1px solid #2e2f31;border-radius:6px;padding:0 10px;height:34px;color:#f2f2f2;font-size:13px;outline:none;font-family:inherit;}
.exec-dd-search input:focus{border-color:#c22f3d;}
.exec-dd-list{max-height:340px;overflow-y:auto;padding:4px;}
.exec-opt{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;background:transparent;border:none;cursor:pointer;transition:background .1s;text-align:left;}
.exec-opt:hover{background:#1f2023;}
/* Diff */
.diff-add{color:#22c55e;background:rgba(34,197,94,.07);}
.diff-rem{color:#ef4444;background:rgba(239,68,68,.08);}
/* Btn */
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;cursor:pointer;border-radius:4px;transition:all .14s;white-space:nowrap;border:1px solid transparent;}
.btn-sm{height:30px;padding:0 12px;font-size:12.5px;}
.btn-md{height:36px;padding:0 14px;font-size:13.5px;}
.btn-primary{background:#c22f3d;color:white;border-color:#a02531;}
.btn-primary:hover{background:#a02531;}
.btn-ghost{background:transparent;color:#d0d0d0;border-color:#a1a1a1;font-weight:600;}
.btn-ghost:hover{background:rgba(255,255,255,.06);color:#f2f2f2;border-color:#d0d0d0;}
.btn-success{background:#238636;color:#fff;border-color:#2ea043;}
.btn-success:hover{background:#2ea043;}
.btn-danger{background:transparent;color:#ef4444;border-color:rgba(239,68,68,.4);}
.btn-danger:hover{background:rgba(239,68,68,.1);}
/* Filter chip */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #202124;color:#a1a1a1;background:transparent;transition:background .12s,border-color .12s,color .12s;text-transform:capitalize;}
.chip:hover{background:#1f2023;border-color:#4a4b4d;color:#f2f2f2;}
.chip.on{background:#1f2023;border-color:#a1a1a1;color:#f2f2f2;}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.chip-x{font-size:13px;line-height:1;opacity:.6;margin-left:1px;}
.chip-clear{color:#707070;border-color:transparent;text-transform:none;}
.chip-clear:hover{color:#f2f2f2;background:transparent;border-color:#4a4b4d;}
.sort-h{cursor:pointer;user-select:none;}
.sort-h:hover{color:#f2f2f2;}
/* Tier bubble */
.tier-bubble{display:inline-flex;align-items:center;gap:5px;font-family:"Geist Mono",monospace;font-size:10px;font-weight:600;}
/* Input */
.inp{background:#0c0d0f;border:1px solid #202124;border-radius:4px;padding:0 12px;color:#f2f2f2;font-size:13.5px;outline:none;height:36px;transition:border-color .14s;}
.inp:focus{border-color:#c22f3d;box-shadow:0 0 0 2px rgba(194,47,61,.22);}
.inp::placeholder{color:#707070;}
/* Attack path step — sequential reveal */
.ap-step{display:flex;gap:16px;align-items:flex-start;position:relative;}
.ap-conn{position:absolute;left:15px;top:36px;bottom:-20px;width:2px;background:#26272a;overflow:hidden;z-index:0;}
.ap-conn .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--sc) 50%,transparent);transform:scaleY(0);transform-origin:top;transition:transform .35s linear;}
.ap-conn.filled .fill{transform:scaleY(1);}
.ap-conn .shim{position:absolute;left:0;right:0;height:40%;top:0;background:linear-gradient(180deg,transparent,rgba(239,68,68,.55),transparent);transform:translateY(-100%);opacity:0;}
.ap-conn.filled.crit .shim{animation:ap-shim 6s linear infinite;}
@keyframes ap-shim{0%{transform:translateY(-100%);opacity:1}14%{transform:translateY(350%);opacity:1}14.1%{opacity:0}100%{transform:translateY(350%);opacity:0}}
.ap-node{position:relative;flex-shrink:0;z-index:1;}
.ap-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--sc);opacity:0;pointer-events:none;}
.ap-step.lit .ap-ring{animation:ap-pulse .4s ease-out;}
.ap-step.climax .ap-ring{animation:ap-pulse .5s ease-out 2;}
@keyframes ap-pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.ap-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-family:"Geist Mono",monospace;font-size:12px;font-weight:900;color:#ffffff;background:var(--sc);transition:color .3s ease-out,background .3s ease-out,box-shadow .3s ease-out;position:relative;z-index:1;}
.ap-step[data-sev="critical"] .ap-dot{box-shadow:0 0 10px rgba(239,68,68,.14);}
.ap-body{flex:1;padding-top:4px;opacity:1;transform:none;transition:opacity .25s ease-out,transform .25s ease-out;min-width:0;}
.ap-tactic{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--sc);}
.ap-fcard{background:#17181a;border:1px solid #202124;border-left:2px solid var(--sc);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .12s;}
.ap-fcard:hover{background:#1f2023;}
/* Dim the pre-lit state ONLY while the narrative is actively animating */
@media (prefers-reduced-motion: no-preference){
  #ap-chain.animate .ap-step:not(.lit) .ap-body{opacity:.35;transform:translateY(4px);}
  #ap-chain.animate .ap-step:not(.lit) .ap-dot{color:rgba(255,255,255,.5);background:#1f2023;box-shadow:none;}
  #ap-chain.animate .ap-step:not(.lit) .ap-fcard{border-left-color:#202124;}
}
@media (prefers-reduced-motion: reduce){
  .ap-ring,.ap-conn .shim{animation:none!important;}
  .ap-body,.ap-dot,.ap-conn .fill{transition:none!important;}
}
.lnk:hover{color:#539fe5;text-decoration:underline;cursor:pointer;}
/* Stepper + gauge instrumentation */
@keyframes ring-in{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.node-ring{animation:ring-in .3s ease-out;}
@keyframes node-pulse{0%,100%{opacity:.12}50%{opacity:.32}}
.node-pulse{animation:node-pulse 2s ease-in-out infinite;}
.spin-15{animation:spin 1.5s linear infinite;transform-origin:center;}
@keyframes conn-flow{from{background-position:-60% 0}to{background-position:160% 0}}
.conn-flow{background-image:linear-gradient(90deg,transparent,rgba(34,197,94,.55),transparent);background-size:45% 100%;background-repeat:no-repeat;background-color:rgba(34,197,94,.16);animation:conn-flow 4s linear infinite;}
@keyframes gauge-fill{from{stroke-dashoffset:207.3}}
.gauge-arc{animation:gauge-fill .8s ease-out;}
@media (prefers-reduced-motion: reduce){
  .node-ring,.node-pulse,.spin,.spin-15,.conn-flow,.gauge-arc{animation:none!important;}
  .conn-flow{background-image:none;background-color:rgba(34,197,94,.5);}
}
/* Data table (real table, shared column axes, vertical dividers) */
.dtbl{width:100%;border-collapse:collapse;table-layout:fixed;}
.dtbl th{padding:10px 16px;font-size:13px;font-weight:700;color:#a1a1a1;background:#0c0d0f;border-bottom:1px solid #202124;text-align:center;white-space:nowrap;}
.dtbl td{padding:12px 16px;border-bottom:1px solid #202124;text-align:center;vertical-align:middle;font-size:13px;}
.dtbl th+th,.dtbl td+td{border-left:1px solid #202124;}
.dtbl tr:last-child td{border-bottom:none;}
.dtbl tbody tr{transition:background .12s;}
.dtbl tbody tr.rowlink{cursor:pointer;}
.dtbl tbody tr:hover{background:#1f2023;}
.dtbl .cl{text-align:left;}
.dtbl-h{display:flex;justify-content:center;align-items:center;gap:6px;}
/* Page grid */
.page-wrap{max-width:1440px;margin:0 auto;padding:24px 32px;}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);}
@media(max-width:1199px){
  .metric-grid{grid-template-columns:repeat(2,1fr);}
  .metric-grid>div:nth-child(3){border-left:none!important;}
  .metric-grid>div:nth-child(n+3){border-top:1px solid #202124;}
}
.row-12{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;}
.col-8{grid-column:span 8;}
.col-4{grid-column:span 4;}
@media(max-width:1199px){.row-12{grid-template-columns:1fr;}.col-8,.col-4{grid-column:auto;}}
/* Stat card */
.stat-card{background:#17181a;border:1px solid #202124;border-radius:4px;padding:20px;}
/* ── Tech-brutalist card system (shared) ── */
:root{--chamfer:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));--ch7:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));}
.stat-card.tb-card{position:relative;background:#222!important;border:none!important;border-radius:0!important;clip-path:var(--chamfer);}
.tb-card::before{content:"";position:absolute;inset:1px;background:#0d0d0d;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:13px 13px;background-position:-1px -1px;clip-path:var(--chamfer);z-index:0;}
.tb-card>*{position:relative;z-index:1;}
.tb-title{font-family:"JetBrains Mono",monospace;text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:#8a8a8a;font-weight:600;white-space:nowrap;}
.tb-idx{font-family:"JetBrains Mono",monospace;font-size:10px;color:#3a3b3d;letter-spacing:.06em;}
.tb-num{font-family:"Chakra Petch","JetBrains Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
.tb-mark{width:6px;height:6px;flex-shrink:0;display:inline-block;}

}
/* During onboarding (no GitHub connection) data tabs have nothing to show — disable them */

  const dataScreens=['findings','inventory','pipelines','attack','remediations'];

/* ═══════════════════════ SCREEN: FINDINGS ═══════════════════════ */
let findingsFilter={sev:null,src:null,tier:null,q:''};
let findingsSort={col:'sev',dir:'desc'};
function setFindingSort(col){
  if(findingsSort.col===col)findingsSort.dir=findingsSort.dir==='asc'?'desc':'asc';
  else findingsSort={col,dir:col==='sev'?'desc':'asc'};
  document.getElementById('app-main').innerHTML=renderFindings(findingsFilter);
  bindFindingsEvents();
}
function goFindings(f){findingsFilter={sev:null,src:null,tier:null,q:'',...(f||{})};navigate('findings');}
function openChainFinding(id){const job=currentExecId?SCAN_JOBS.find(j=>j.id===currentExecId):SCAN_JOBS[0];const ins=job&&INSIGHTS[job.id];window.currentFindingIds=ins&&ins.attack_path?ins.attack_path.map(s=>s.finding_ids[0]).filter(Boolean):[id];openFinding(id);}

function renderFindings(filter){
  const f=filter||findingsFilter;
  let list=FINDINGS.slice();
  if(f.sev)list=list.filter(x=>x.severity===f.sev);
  if(f.src)list=list.filter(x=>x.source===f.src);
  if(f.tier)list=list.filter(x=>x.tier===+f.tier);
  if(f.q)list=list.filter(x=>x.title.toLowerCase().includes(f.q)||x.file_path?.toLowerCase().includes(f.q)||x.cve_id?.toLowerCase().includes(f.q));
  const dir=findingsSort.dir==='asc'?1:-1;
  list.sort((a,b)=>{
    let av,bv;
    if(findingsSort.col==='tier'){av=a.tier;bv=b.tier;}
    else if(findingsSort.col==='when'){av=new Date(a.created_at).getTime();bv=new Date(b.created_at).getTime();}
    else {av=SEV_ORDER[a.severity]||0;bv=SEV_ORDER[b.severity]||0;}
    return (av-bv)*dir;
  });

  const srcs=['trufflehog','semgrep','trivy','prowler','zap'];
  window.currentFindingIds=list.map(x=>x.id);
  const sevChips=['critical','high','medium','low','info'].map(s=>{const on=f.sev===s;const c=sevColor(s);const style=on?`--c:${c};background:${hexA(c,.12)};border-color:${hexA(c,.4)};color:${c};`:`--c:${c};`;return `<button class="chip${on?' on':''}" style="${style}" onclick="setFindingFilter('sev','${s}')"><span class="chip-dot" style="background:${c};"></span>${s}${on?'<span class="chip-x">\u00d7</span>':''}</button>`;}).join('');
  const srcChips=srcs.map(s=>`<button class="chip${f.src===s?' on':''}" onclick="setFindingFilter('src','${s}')">${s}${f.src===s?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');
  const tierChips=[1,2,3].map(t=>`<button class="chip${f.tier===String(t)?' on':''}" onclick="setFindingFilter('tier','${t}')">Tier ${t}${f.tier===String(t)?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');

  const rows=list.map(fn=>`
  <tr class="rowlink" onclick="openFinding('${fn.id}')">
    <td>${sevBadge(fn.severity)}</td>
    <td class="cl" style="overflow:hidden;">
      <div class="font-medium text-fg truncate">${fn.title}${fn.secret_verified?`<span class="mono text-[9px] px-1.5 py-0.5 ml-1.5" style="color:#ff2d3d;background:rgba(255,45,61,.1);border:1px solid rgba(255,45,61,.4);border-radius:999px;">Verified</span>`:''}</div>
      <div class="mono text-[10px] text-fg-dim mt-0.5 truncate">${fn.file_path||'—'}:${fn.line_number||'?'}</div>
    </td>
    <td><span class="mono text-[10px] text-fg-mute">${fn.source}</span></td>
    <td style="overflow:hidden;"><span class="mono text-[10px] text-fg-dim">${fn.cve_id||fn.cwe_id||'—'}</span></td>
    <td><span class="mono text-[10px] px-1.5 py-0.5 rounded" style="background:#1f2023;color:#a1a1a1;">T${fn.tier}</span></td>
    <td>${timeTag(fn.created_at,"text-[12px] text-fg-dim")}</td>
  </tr>`).join('');

  return `<div class="page-wrap">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-[24px] font-bold tracking-tight">Findings <span class="text-[14px] text-fg-mute font-normal">${list.length} de ${FINDINGS.length} exibidos</span></h1>
      <p class="text-fg-dim text-[13px] mt-1">Vulnerabilidades detectadas pelos scanners — ordenadas por severidade</p>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-wrap mb-4">
    <input class="inp" style="width:240px;" placeholder="Buscar título, arquivo, CVE…" value="${f.q}" oninput="setFindingFilter('q',this.value)"/>
    <div class="w-px h-6 bg-line mx-1"></div>
    ${sevChips}
    <div class="w-px h-6 bg-line mx-1"></div>
    ${srcChips}
    <div class="w-px h-6 bg-line mx-1"></div>
    ${tierChips}
    ${(f.sev||f.src||f.tier||f.q)?`<button class="chip chip-clear" onclick="clearFindingFilters()">Limpar filtros</button>`:''}
  </div>
  <div class="stat-card" style="padding:0;overflow:hidden;">
    <table class="dtbl">
      <colgroup><col style="width:120px"><col><col style="width:110px"><col style="width:140px"><col style="width:70px"><col style="width:100px"></colgroup>
      <thead><tr>
        <th class="sort-h" onclick="setFindingSort('sev')"><span class="dtbl-h">Severidade${sortArrow('sev')}</span></th>
        <th class="cl">Título / Arquivo</th>
        <th>Scanner</th>
        <th>CVE / CWE</th>
        <th class="sort-h" onclick="setFindingSort('tier')"><span class="dtbl-h">Tier${sortArrow('tier')}</span></th>
        <th class="sort-h" onclick="setFindingSort('when')"><span class="dtbl-h">Quando${sortArrow('when')}</span></th>
      </tr></thead>
      <tbody>${rows||`<tr><td colspan="6" style="padding:0;">${FINDINGS.length===0?emptyState({title:'Nenhum finding — seu código está limpo neste commit.',body:'O último scan não encontrou vulnerabilidades. Novos findings aparecem aqui a cada scan.'}):emptyState({title:'Nenhum finding com esses filtros',body:'Ajuste ou limpe os filtros para ver os findings desta execução.',action:'<button class="chip chip-clear" onclick="clearFindingFilters()">Limpar filtros</button>'})}</td></tr>`}</tbody>
    </table>
  </div>
</div>`;
}

function bindFindingsEvents(){}

function setFindingFilter(key,val){
  if(findingsFilter[key]===val) findingsFilter[key]=key==='q'?'':null;
  else findingsFilter[key]=val;
  document.getElementById('app-main').innerHTML=renderFindings(findingsFilter);

/* ═══ Mascot line-art + empty-state pattern ═══ */
function mascotSvg(size){
  const s=size||120;
  return `<svg width="${s}" height="${s}" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <path d="M40 30 L33 52 C34 71 45 84 58 84 C71 84 82 71 83 52 L76 30 L69 46 C64 43 52 43 47 46 Z"/>

    <path d="M37 38 Q58 46 79 38"/>
    <!-- left eye -->
    <circle cx="50" cy="58" r="2.4" fill="currentColor" stroke="none"/>
    <!-- nose + mouth -->
    <path d="M58 66 l-2.5 3 h5 Z" fill="currentColor" stroke="none"/>
    <path d="M58 69 v3 M58 72 q-4 3 -8 1 M58 72 q4 3 8 1"/>
    <!-- whiskers left -->
    <path d="M46 66 L30 63 M46 70 L31 71"/>
    <!-- magnifying glass over right eye -->

function emptyState(opts){

    <div style="color:#707070;margin-bottom:20px;">${mascotSvg(120)}</div>

    ${action?`<div style="margin-top:18px;">${action}</div>`:''}
  </div>`;
}

function openFinding(id){
  const fn=FINDINGS.find(f=>f.id===id);
  if(!fn)return;
  window.currentFindingId=id;
  const ids=window.currentFindingIds&&window.currentFindingIds.length?window.currentFindingIds:FINDINGS.map(f=>f.id);
  const idx=ids.indexOf(id);
  const rem=REMEDIATIONS.find(r=>r.finding_id===id);

  /* CVE/CWE external link */
  let idLink='—';
  if(fn.cve_id){idLink=`<a href="https://nvd.nist.gov/vuln/detail/${fn.cve_id}" target="_blank" rel="noopener" class="lnk-ext">${fn.cve_id} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-1px;"><path d="M14 4h6v6M20 4l-9 9M17 13v6a1 1 0 01-1 1H5a1 1 0 01-1-1V8a1 1 0 011-1h6"/></svg></a>`;}
  else if(fn.cwe_id){const num=(fn.cwe_id.match(/\d+/)||[''])[0];idLink=`<a href="https://cwe.mitre.org/data/definitions/${num}.html" target="_blank" rel="noopener" class="lnk-ext">${fn.cwe_id} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-1px;"><path d="M14 4h6v6M20 4l-9 9M17 13v6a1 1 0 01-1 1H5a1 1 0 01-1-1V8a1 1 0 011-1h6"/></svg></a>`;}

  /* Remediation section */
  let remHtml;
  if(rem){
    const rotation=rem.requires_secret_rotation?rotationBlock(rem.rotation_instructions):'';
    remHtml=`
  <div style="background:#17181a;border:1px solid #202124;border-radius:8px;padding:16px;margin-top:16px;">
    <div class="flex items-center justify-between mb-2">
      <div class="text-[14px] text-fg-mute">Remediação sugerida pelo Claude</div>
      <span class="sev ${rem.status==='approved'?'st-done':rem.status==='rejected'?'st-failed':'st-queued'}">${REM_STATUS_PT[rem.status]||rem.status}</span>
    </div>
    <p class="text-[13px] text-fg-mute mb-3">${rem.explanation}</p>
    ${rotation}
    ${diffBlock(rem.patch_diff,fn.file_path)}
    <button class="btn btn-sm btn-ghost mt-3" style="gap:6px;" onclick="openRemFromFinding('${rem.id}')">Abrir em Remediações <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>`;
  } else {
    remHtml='<div style="color:#707070;font-size:13px;margin-top:12px;">Nenhuma remediação gerada ainda.</div>';
  }

  document.getElementById('panel').innerHTML=`
  <div style="display:flex;flex-direction:column;height:100%;">
    <div style="flex-shrink:0;padding:16px 24px;border-bottom:1px solid #202124;display:flex;align-items:center;justify-content:space-between;">

    </div>
    <div style="flex:1;overflow-y:auto;padding:24px;">
      <div class="flex items-center gap-2 mb-4">${sevBadge(fn.severity)}${fn.secret_verified?`<span class="mono text-[9px] px-1.5 py-0.5" style="color:#ef4444;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);border-radius:999px;">Verified Secret</span>`:''}</div>
      <h2 style="font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px;">${fn.title}</h2>

function navFinding(dir){

}
function openRemFromFinding(remId){
  closePanel();
  window.highlightRem=remId;
  navigate('remediations');
  setTimeout(()=>{
    const el=document.getElementById('rem-'+remId);
    if(el){el.scrollIntoView({block:'center'});el.style.transition='box-shadow .3s';el.style.boxShadow='0 0 0 2px #c22f3d';setTimeout(()=>{el.style.boxShadow='';},1600);}
  },80);
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* Shared diff block: GitHub-style header (file path + change count) + body */
function diffBlock(patch,filePath){
  let add=0,rem=0;
  const body=patch.split('\n').map(l=>{
    if(l.startsWith('+')){add++;return `<span class="diff-add">${escHtml(l)}</span>`;}
    if(l.startsWith('-')){rem++;return `<span class="diff-rem">${escHtml(l)}</span>`;}
    return `<span style="color:#707070;">${escHtml(l)}</span>`;
  }).join('\n');
  const hdr=`<div style="display:flex;align-items:center;justify-content:space-between;background:#0c0d0f;border:1px solid #202124;border-bottom:none;border-radius:6px 6px 0 0;padding:6px 10px;">
    <span class="mono" style="font-size:11px;color:#a1a1a1;display:inline-flex;align-items:center;gap:6px;overflow:hidden;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${filePath||'patch'}</span></span>
    <span class="mono" style="font-size:11px;flex-shrink:0;margin-left:10px;"><span style="color:var(--sev-safe);">+${add}</span> <span style="color:var(--sev-critical);">−${rem}</span></span>
  </div>`;
  return `${hdr}<pre style="background:#0c0d0f;border:1px solid #202124;border-radius:0 0 6px 6px;padding:12px;overflow-x:auto;font-size:11.5px;line-height:1.7;margin:0;">${body}</pre>`;
}
/* Shared rotation-procedure block (neutral surface, amber left-border) */
function rotationBlock(instructions){
  const monoIds=s=>escHtml(s).replace(/\b([A-Z][A-Z0-9_\/]{6,})\b/g,'<span class="mono">$1</span>');
  let steps='';
  if(instructions){
    steps='<ol style="margin:8px 0 0;padding-left:20px;list-style:decimal;">'+
      instructions.replace(/\\n/g,'\n').split('\n').map(l=>l.replace(/^\d+\.\s*/,'').trim()).filter(Boolean)
      .map(l=>`<li style="font-size:12.5px;color:#f2f2f2;line-height:1.5;margin-bottom:4px;padding-left:2px;">${monoIds(l)}</li>`).join('')+'</ol>';
  }
  return `<div style="background:#17181a;border:1px solid #202124;border-left:3px solid #eab308;border-radius:6px;padding:10px 12px;margin:10px 0;display:flex;gap:9px;align-items:flex-start;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><div style="min-width:0;"><div style="font-size:13px;font-weight:600;color:#f2f2f2;">Rotação de credencial necessária</div>${steps||'<div style="font-size:12px;color:#a1a1a1;margin-top:1px;">Este secret foi verificado — rotacione a credencial antes de aplicar o patch.</div>'}</div></div>`;
}
function metaItem(k,v){return `<div style="background:#17181a;border:1px solid #202124;border-radius:6px;padding:8px 10px;"><div style="font-size:13px;font-weight:400;color:#a1a1a1;margin-bottom:3px;">${k}</div><div style="font-size:12.5px;font-weight:500;color:#f2f2f2;">${v}</div></div>`;}
function metaItemBadge(k,crit){return `<div style="background:#17181a;border:1px solid #202124;border-radius:6px;padding:8px 10px;"><div style="font-size:13px;font-weight:400;color:#a1a1a1;margin-bottom:5px;">${k}</div>${crit?sevBadge(crit):'<span style="font-size:12.5px;color:#f2f2f2;">—</span>'}</div>`;}
function closePanel(){const _p=document.getElementById('panel');if(_p)_p.classList.remove('open');const _o=document.getElementById('overlay');if(_o)_o.classList.remove('open');}

/* ═══════════════════════ SCREEN: PIPELINES ═══════════════════════ */
let pipelineInterval=null;

function riskCompact(score,level){
  if(score==null)return `<span class="mono text-[11px] text-fg-dim">${level||'—'}</span>`;
  const b=gaugeBand(score);
  return `<span class="flex items-center gap-1.5">${miniGauge(score)}<span class="mono text-[13px] font-semibold" style="color:${b.c};">${score}</span></span>`;
}
let pipelinesFilter={repo:null,status:null,tier:null};
function pipeStatus(j){
  if(j.blocked_at_tier===1||j.final_risk_level==='blocked')return 'blocked';
  if(j.tier2_status==='failed'||j.tier3_status==='failed')return 'failed';
  if(j.tier1_status==='running'||j.tier2_status==='running'||j.tier3_status==='running')return 'running';
  return 'done';
}
function pipeTierReached(j){
  if(j.tier3_status&&j.tier3_status!=='skipped')return 3;
  if(j.tier2_status&&j.tier2_status!=='skipped')return 2;
  return 1;
}
function setPipelineFilter(key,val){
  pipelinesFilter[key]=pipelinesFilter[key]===val?null:val;
  document.getElementById('app-main').innerHTML=renderPipelines();
  bindScreenEvents('pipelines');
}
function clearPipelineFilters(){pipelinesFilter={repo:null,status:null,tier:null};document.getElementById('app-main').innerHTML=renderPipelines();bindScreenEvents('pipelines');}

function renderPipelines(){
  const pf=pipelinesFilter;
  let list=SCAN_JOBS.filter(j=>
    (!pf.repo||j.repo_full_name===pf.repo)&&
    (!pf.status||pipeStatus(j)===pf.status)&&
    (!pf.tier||pipeTierReached(j)===pf.tier)
  );
  const rows=list.map(j=>{
    const hasRunning=j.tier1_status==='running'||j.tier2_status==='running'||j.tier3_status==='running';
    const isBlocked=j.blocked_at_tier!=null&&j.final_risk_level!=='blocked'||j.final_risk_level==='blocked';
    return `<div class="stat-card card-link mb-3" style="cursor:pointer;" onclick="openInsights('${j.id}')">
    <div class="flex items-center justify-between mb-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold text-[15px]">${j.repo_full_name}</span>
          <span class="mono text-[10px] text-fg-dim">PR #${j.pr_number}</span>
          ${hasRunning?`<span class="sev st-running" style="gap:4px;"><svg class="spin" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 11-9-9"/></svg>em execução</span>`:''}
          ${isBlocked&&j.final_risk_level==='blocked'?`<span class="sev st-blocked">gate1 bloqueado</span>`:''}
        </div>
        <div class="text-[12px] text-fg-dim mt-0.5"><span class="mono">commit ${shortSha(j.commit_sha)}</span> · ${timeTag(j.created_at)}</div>
      </div>
      ${riskCompact(j.final_risk_score,j.final_risk_level)}
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid #202124;"><div style="max-width:700px;">${tierStepper(j)}</div></div>
  </div>`;
  }).join('');

  const repos=[...new Set(SCAN_JOBS.map(j=>j.repo_full_name))];
  const repoChips=repos.map(rp=>`<button class="chip${pf.repo===rp?' on':''}" style="text-transform:none;" onclick="setPipelineFilter('repo','${rp}')">${rp.split('/')[1]||rp}${pf.repo===rp?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');
  const statusOpts=[['done','Concluído'],['running','Em execução'],['failed','Falhou'],['blocked','Bloqueado']];
  const statusChips=statusOpts.map(([v,l])=>`<button class="chip${pf.status===v?' on':''}" onclick="setPipelineFilter('status','${v}')">${l}${pf.status===v?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');
  const tierChips=[1,2,3].map(t=>`<button class="chip${pf.tier===t?' on':''}" onclick="setPipelineFilter('tier',${t})">Tier ${t}${pf.tier===t?'<span class="chip-x">\u00d7</span>':''}</button>`).join('');
  const anyFilter=pf.repo||pf.status||pf.tier;

  const runningCount=SCAN_JOBS.filter(j=>pipeStatus(j)==='running').length;
  return `<div class="page-wrap">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-[24px] font-bold tracking-tight">Scans <span class="text-[14px] text-fg-mute font-normal">${SCAN_JOBS.length} no total</span></h1>
      <p class="text-fg-dim text-[13px] mt-1">Execuções dos repositórios monitorados${runningCount>0?` · ${runningCount} em execução`:''}</p>
    </div>
    <div class="flex items-center gap-2">
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#a1a1a1;"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse-safe 2s infinite;"></span>Atualização automática</span>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-wrap mb-4">
    ${repoChips}
    <div class="w-px h-6 bg-line mx-1"></div>
    ${statusChips}
    <div class="w-px h-6 bg-line mx-1"></div>
    ${tierChips}
    ${anyFilter?`<button class="chip chip-clear" onclick="clearPipelineFilters()">Limpar filtros</button>`:''}
  </div>
  ${rows||(SCAN_JOBS.length===0?`<div class="stat-card">${emptyState({title:'Nenhum scan ainda',body:'Conecte um repositório e abra um pull request para disparar o primeiro scan. Cada PR roda os três tiers automaticamente.',action:`<button class="btn btn-md btn-primary" onclick="navigate('integrations')">Configurar scanners</button>`})}</div>`:`<div class="stat-card">${emptyState({title:'Nenhuma execução com esses filtros',body:'Ajuste ou limpe os filtros para ver as execuções do histórico.',action:`<button class="chip chip-clear" onclick="clearPipelineFilters()">Limpar filtros</button>`})}</div>`)}
</div>`;
}

function tierStep(label,status,dur,scanners,failed){
  if(!status)return`<div style="opacity:.25;padding:8px 12px;border:1px solid #202124;border-radius:7px;min-width:100px;"><div class="mono text-[9px] text-fg-dim">${label}</div><div class="mono text-[9px] text-fg-dim mt-1">—</div></div>`;
  const col={done:'#22c55e',running:'#3b82f6',failed:'#ef4444',skipped:'#707070'}[status]||'#707070';
  return`<div style="padding:8px 12px;border:1px solid ${col}33;border-radius:7px;min-width:100px;background:${col}0a;">
    <div class="flex items-center gap-1.5 mb-1"><span class="mono text-[9px]" style="color:${col}">${label}</span>${status==='running'?`<svg class="spin" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:${col}"><path d="M21 12a9 9 0 11-9-9"/></svg>`:''}</div>
    <div class="mono text-[9px] text-fg-dim">${scanners.slice(0,2).join(' · ')}${scanners.length>2?' +1':''}</div>
    ${dur?`<div class="mono text-[9px] mt-1" style="color:${col}">${dur}</div>`:''}
  </div>`;
}
function tierArrow(status){
  if(!status||status==='skipped')return`<div style="width:20px;height:1px;background:#26272a;margin:0 4px;flex-shrink:0;"></div>`;
  return`<div style="width:20px;height:1px;background:#707070;margin:0 4px;flex-shrink:0;"></div>`;
}

function startPipelinePolling(){
  if(pipelineInterval)clearInterval(pipelineInterval);
  let tick=0;
  pipelineInterval=setInterval(()=>{
    tick++;
    if(currentScreen!=='pipelines'){clearInterval(pipelineInterval);return;}
    // simulate T3 completing for s2
    if(tick===4){SCAN_JOBS[1].tier3_status='done';SCAN_JOBS[1].final_risk_score=412;SCAN_JOBS[1].final_risk_level='high';SCAN_JOBS[1].t3_dur='9m';}
    document.getElementById('app-main').innerHTML=renderPipelines();
  },3000);
}

/* ═══════════════════════ SCREEN: REMEDIATIONS ═══════════════════════ */
function renderRemediations(){
  const cards=REMEDIATIONS.map(r=>{
    const fn=FINDINGS.find(f=>f.id===r.finding_id)||{};
    const job=SCAN_JOBS.find(j=>j.id===r.scan_job_id);
    const stCls={suggested:'st-queued',approved:'st-done',rejected:'st-failed',merged:'st-done'}[r.status]||'st-queued';
    const btns=r.status==='suggested'?`
    <div class="flex items-center gap-2 mt-3">
      <button class="btn btn-sm btn-success" onclick="approveRem('${r.id}')">Aprovar patch</button>
      <button class="btn btn-sm btn-danger" onclick="rejectRem('${r.id}')">Rejeitar</button>
    </div>`:(r.status==='approved'?`<div class="mt-3 text-[12px]" style="color:#22c55e;">Aprovado por ${r.approved_by||'—'}</div>`:r.status==='rejected'?`<div class="mt-3 text-[12px]" style="color:#ef4444;">Rejeitado por ${r.approved_by||'—'}</div>`:'');
    return`<div class="stat-card mb-6" id="rem-${r.id}">
      <div class="flex items-start justify-between mb-3">
        <div style="flex:1;min-width:0;">
          <div class="flex items-center gap-2 flex-wrap">
            ${fn.severity?sevBadge(fn.severity):''}
            <span class="sev ${stCls}">${REM_STATUS_PT[r.status]||r.status}</span>
          </div>
          <h3 class="font-semibold text-[15px] mt-2 leading-snug">${fn.title||'Finding #'+r.finding_id}</h3>
          <p class="text-fg-mute text-[12.5px] mt-1.5 leading-relaxed">${r.explanation}</p>
          ${r.requires_secret_rotation?rotationBlock(r.rotation_instructions):''}
        </div>
      </div>
      <div class="text-[14px] text-fg-mute mb-2">Patch diff · gerado pelo Claude Sonnet</div>
      ${diffBlock(r.patch_diff,fn.file_path)}
      <div class="flex items-center gap-4 mt-3 text-[12px]">
        ${fn.id?`<button class="lnk-ext" style="background:none;border:none;cursor:pointer;padding:0;font:inherit;" onclick="openFinding('${fn.id}')">Origem: ${fn.title}</button>`:''}
        ${(fn.repo_url&&job&&job.pr_number)?`<a class="lnk-ext" href="${fn.repo_url}/pull/${job.pr_number}" target="_blank" rel="noopener">PR #${job.pr_number} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-1px;"><path d="M14 4h6v6M20 4l-9 9M17 13v6a1 1 0 01-1 1H5a1 1 0 01-1-1V8a1 1 0 011-1h6"/></svg></a>`:''}
      </div>
      ${btns}
    </div>`;
  }).join('');

  return`<div class="page-wrap">
  <div class="mb-6">
    <h1 class="text-[24px] font-bold tracking-tight">Remediações</h1>
    <p class="text-fg-dim text-[13px] mt-1">Patches sugeridos pelo Claude — aguardando aprovação humana antes de aplicar</p>
  </div>
  ${cards}
</div>`;
}

/* ═══════════════════════ SCREEN: ATTACK PATH ═══════════════════════ */
const AP_PHASES={initial_access:'Initial Access',execution:'Execution',persistence:'Persistence',privilege_escalation:'Privilege Escalation',defense_evasion:'Defense Evasion',credential_access:'Credential Access',discovery:'Discovery',lateral_movement:'Lateral Movement',collection:'Collection',exfiltration:'Exfiltration',impact:'Impact',reconnaissance:'Reconnaissance'};
let currentExecId=null;
function openInsights(id){currentExecId=id;navigate('attack');}
function execOutcome(j){

function execDropdownList(currentId){

      <span style="display:flex;align-items:center;gap:8px;min-width:0;">
        ${j.id===currentId?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c22f3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M5 12l5 5L20 7"/></svg>':'<span style="width:13px;flex-shrink:0;"></span>'}

let apTimers=[],apPlayed=false;
function apSetStatic(steps,prog){
  steps.forEach(st=>{
    st.classList.add('lit');
    const c=st.querySelector('.ap-conn');
    if(c){c.classList.add('filled');if(st.dataset.sev==='critical')c.classList.add('crit');}
  });
  if(prog)prog.style.display='none';
}
function playAttackChain(force){
  const chain=document.getElementById('ap-chain');
  const steps=[...document.querySelectorAll('#ap-chain .ap-step')];
  if(!steps.length)return;
  const prog=document.getElementById('ap-progress');
  apTimers.forEach(clearTimeout);apTimers=[];
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    if(chain)chain.classList.remove('animate');
    apSetStatic(steps,prog);
    steps[steps.length-1].classList.add('climax');
    return;
  }
  if(chain)chain.classList.add('animate');
  steps.forEach(st=>{
    st.classList.remove('lit','climax');
    const c=st.querySelector('.ap-conn');
    if(c)c.classList.remove('filled','crit');
  });
  if(prog){prog.style.display='';prog.textContent='Passo 1 de '+steps.length;}
  let critCount=0;
  steps.forEach((st,i)=>{
    apTimers.push(setTimeout(()=>{
      st.classList.add('lit');
      if(i===steps.length-1)st.classList.add('climax');
      if(prog)prog.textContent='Passo '+(i+1)+' de '+steps.length;
      const c=st.querySelector('.ap-conn');
      if(c)apTimers.push(setTimeout(()=>{
        c.classList.add('filled');
        if(st.dataset.sev==='critical'){
          const sh=c.querySelector('.shim');
          if(sh)sh.style.animationDelay=(critCount++*3)+'s';
          c.classList.add('crit');
        }
      },550));
    },i*1200));
  });
  apTimers.push(setTimeout(()=>{if(prog)prog.style.display='none';},steps.length*1200+500));
}
function apObserve(){
  const chain=document.getElementById('ap-chain');
  if(!chain)return;
  apPlayed=false;
  const fire=()=>{if(!apPlayed){apPlayed=true;playAttackChain();}};
  // If already in view, play on next frame; else observe.
  const r=chain.getBoundingClientRect();
  if(r.top<window.innerHeight&&r.bottom>0){requestAnimationFrame(fire);return;}
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting&&!apPlayed){obs.disconnect();fire();}
    });
  },{threshold:.15});
  obs.observe(chain);
}

    <td>${a.risk_score?`<span class="mono text-[12px] font-semibold" style="font-variant-numeric:tabular-nums;color:${a.risk_score>700?'var(--sev-critical)':a.risk_score>=400?'var(--sev-medium)':'var(--sev-safe)'}">${a.risk_score}</span>`:'<span class="text-[12px] text-fg-dim">—</span>'}</td>
    <td><div style="display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:100%;">${scannerBadges}</div></td>
    <td><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></td>
  </tr>`;
  }).join('');

  const totFindings=visibleAssets.reduce((s,a)=>s+(findingsByAsset[a.name]||0),0);
  const withRisk=visibleAssets.filter(a=>a.risk_score!=null);
  const avgRisk=withRisk.length?Math.round(withRisk.reduce((s,a)=>s+a.risk_score,0)/withRisk.length):null;
  const summary=`${visibleAssets.length} assets · ${totFindings} findings${avgRisk!=null?` · risco médio ${avgRisk}`:''}`;

  return`<div class="page-wrap">
  <div class="mb-6">
    <h1 class="text-[24px] font-bold tracking-tight">Inventário de Assets</h1>
    <p class="text-fg-dim text-[13px] mt-1">Repositórios e recursos cloud monitorados pelo aperIA</p>

        <th><span class="dtbl-h">${INV_HICO.scan_at}Último Scan</span></th>
        <th><span class="dtbl-h">${INV_HICO.risk}Risk</span></th>
        <th><span class="dtbl-h">${INV_HICO.scanners}Scanners</span></th>

      <tbody>${rows}</tbody>
    </table>
    <div style="padding:12px 16px;border-top:1px solid #202124;font-size:12px;color:#a1a1a1;">${summary}</div>
  </div>
</div>`;
}

function onGlobalSearch(q){
  if(!q)return;
  if(currentScreen!=='findings'){findingsFilter.q=q;navigate('findings');}
  else{setFindingFilter('q',q);}
}

/* ═══════════════════════ SIDEBAR TOGGLE ═══════════════════════ */
function toggleSb(){
  const sb=document.getElementById('sb'),shell=document.getElementById('app-shell'),ico=document.getElementById('sb-tgl-ico'),btn=document.getElementById('sb-tgl');
  const col=sb.classList.toggle('sb-c');
  shell.style.gridTemplateColumns=col?'64px 1fr':'256px 1fr';
  ico.querySelector('path').setAttribute('d',col?'M9 6l6 6-6 6':'M15 6l-6 6 6 6');
  btn.title=col?'Expandir sidebar':'Recolher sidebar';
  localStorage.setItem('aperia-sb-col',col);
}

/* ═══════════════════════ INIT ═══════════════════════ */
(function(){
  if(localStorage.getItem('aperia-sb-col')==='true'){
    const sb=document.getElementById('sb'),shell=document.getElementById('app-shell'),ico=document.getElementById('sb-tgl-ico'),btn=document.getElementById('sb-tgl');
    if(sb&&shell){sb.classList.add('sb-c');shell.style.gridTemplateColumns='64px 1fr';if(ico)ico.querySelector('path').setAttribute('d','M15 6l-6 6 6 6');if(btn)btn.title='Expandir sidebar';const w=document.getElementById('sb-expand-wrap');if(w)w.style.display='flex';}
  }
  const saved=localStorage.getItem('aperia-screen')||'home';
  navigate(saved);
  document.addEventListener('keydown',e=>{
    const open=document.getElementById('panel').classList.contains('open');
    if(!open)return;
    if(e.key==='Escape'){closePanel();}
    else if(e.key==='ArrowDown'){e.preventDefault();navFinding(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();navFinding(-1);}
  });
})();

<script>
(function(){
  var REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var STEPS = [{"screen":null},{"screen":"home"},{"screen":"findings"},{"screen":"insights"},{"screen":"remediations"},{"screen":"scans"},{"screen":"inventory"},{"screen":"integrations"}];
  var active = 0, iv;
  var win=document.getElementById('win'), intro=document.getElementById('intro');
  var scrs=[].slice.call(document.querySelectorAll('.scr'));
  var dots=[].slice.call(document.querySelectorAll('.dot'));

  function render(){
    var step=STEPS[active], isIntro=!step.screen;
    intro.style.opacity=isIntro?'1':'0';
    win.style.opacity=isIntro?'0':'1';
    win.style.transform=isIntro?'scale(.97)':'none';
    scrs.forEach(function(img){ img.style.opacity=(!isIntro && +img.dataset.i===active)?'1':'0'; });
    dots.forEach(function(d,i){
      var on=i===active;
      d.style.width=on?'22px':'7px';
      d.style.background=on?'#d81f2a':'#c4c9d0';
    });
  }
  render();
  if(!REDUCE){ iv=setInterval(function(){ active=(active+1)%STEPS.length; render(); },4600); }

  // password toggle
  var pw=document.getElementById('pw'), tgl=document.getElementById('pw-toggle');
  tgl.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    tgl.textContent=show?'ocultar':'mostrar';
  });

  // form submit — LIGAR AO SEU AUTH REAL AQUI
  document.getElementById('signup-form').addEventListener('submit',function(e){
    e.preventDefault();
    var data=Object.fromEntries(new FormData(e.target).entries());
    console.log('signup', data);
    // TODO: chamar sua API de cadastro / OAuth
  });

  // code rain
  var cv=document.getElementById('rain'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,GL='01{}</>xaf9$;=+#λ',rain=[],last=0,raf;
  function resize(){ var r=cv.getBoundingClientRect(); W=r.width;H=r.height;DPR=Math.min(window.devicePixelRatio||1,1.75);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); window.addEventListener('resize',resize);
  if(!REDUCE){
    function draw(now){
      var dt=Math.min(0.05,(now-(last||now))/1000); last=now;
      ctx.clearRect(0,0,W,H);
      if(rain.length<80 && Math.random()<0.5){ var len=5+Math.floor(Math.random()*6); rain.push({x:Math.round(Math.random()*W),y:-Math.random()*120,vy:32+Math.random()*58,step:13,g:Array.from({length:len},function(){return GL[Math.floor(Math.random()*GL.length)];})}); }
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='600 11px "JetBrains Mono",monospace';
      for(var i=rain.length-1;i>=0;i--){ var dr=rain[i]; dr.y+=dr.vy*dt;
        if(Math.random()<0.02) dr.g[dr.g.length-1]=GL[Math.floor(Math.random()*GL.length)];
        if(dr.y-dr.g.length*dr.step>H){ rain.splice(i,1); continue; }
        for(var k=0;k<dr.g.length;k++){ var gy=dr.y-k*dr.step; if(gy<-12||gy>H+12) continue; var fade=1-k/dr.g.length; ctx.globalAlpha=(k===0?0.5:0.26*fade); ctx.fillStyle='rgba(216,31,42,'+(k===0?1:0.85)+')'; ctx.fillText(dr.g[k],dr.x,gy); }
      }
      ctx.globalAlpha=1; raf=requestAnimationFrame(draw);
    }
    raf=requestAnimationFrame(draw);
  }
})();
</script>

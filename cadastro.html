<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link rel="icon" href="assets/mark.svg">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Open Sans','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#f2f0e9}
  a{color:#d81f2a;text-decoration:none}
  a:hover{color:#e5333b}
  ::selection{background:rgba(216,31,42,.28);color:#fff}
  input::placeholder{color:#9aa0ab}
  @keyframes shineSweep{0%{background-position:-140% 0,0 0}100%{background-position:260% 0,0 0}}
  @font-face{font-family:'Electro Garden';src:url("assets/fonts/ElectroGarden.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
  .g-btn:hover{background:#f7f6f2 !important;border-color:#c8c6bd !important}
  .sub-btn:hover{background:#c11a24 !important}
  .fld:focus{border-color:#d81f2a !important;box-shadow:0 0 0 3px rgba(216,31,42,.14) !important}
  .back-link{color:#767c88;transition:color .15s}
  .back-link:hover{color:#181a1d}
  @media (max-width:880px){
    [data-page]{grid-template-columns:1fr !important}
    [data-page]>aside{display:none !important}
    [data-page]>main{max-height:none !important}
  }
</style>
</helmet>

<div data-page="" style="display:grid;grid-template-columns:minmax(0,0.94fr) minmax(0,1fr);min-height:100vh;background:#f2f0e9">

  <!-- ══ LEFT · dashboard real (light) rolando ══ -->
  <aside ref="{{ asideRef }}" style="position:relative;overflow:hidden;background:linear-gradient(155deg,#f2f0e9 0%,#e7e3d9 100%);display:flex;flex-direction:column;padding:34px 34px 44px">

    <div style="position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column">
      <div style="position:relative;flex:1;min-height:0;border-radius:15px;overflow:hidden;background:#fff;border:1px solid #dfe2e7;box-shadow:0 30px 80px -42px rgba(20,24,31,.55);transition:opacity .55s ease,transform .55s ease;{{ winStyle }}">
        <iframe ref="{{ appRef }}" src="dash/index.html" title="aperIA dashboard real" scrolling="no" style="position:absolute;top:0;left:0;border:0;background:#f4f6fa;transform-origin:0 0"></iframe>
      </div>

      <!-- intro (antes do dash aparecer) -->
      <div style="position:absolute;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .7s ease;{{ introOn }}">
        <div style="font-family:'Electro Garden','Space Grotesk',sans-serif;font-weight:400;font-size:clamp(42px,4.8vw,60px);line-height:1.06;letter-spacing:-.01em;color:#181a1d">Bem-vindo ao aper<span style="color:#d81f2a">IA</span></div>
        <div style="width:46px;height:3px;border-radius:999px;background:#d81f2a;margin-top:22px;box-shadow:0 0 12px rgba(216,31,42,.6)"></div>
      </div>

      <!-- dots -->
      <div style="position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:4">
        <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="8">
          <span style="{{ dot.style }}"></span>
        </sc-for>
      </div>
    </div>
  </aside>

  <!-- ══ RIGHT · form (cadastro OU login, conforme ?mode) ══ -->
  <main style="position:relative;overflow-y:auto;max-height:100vh;display:flex;justify-content:center;padding:40px 40px 56px">
    <div style="width:100%;max-width:440px;margin:auto 0">
      <a href="index.html" class="back-link" style="display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;margin-bottom:40px"><span style="font-size:16px">←</span> Voltar ao site</a>
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.02em;color:#181a1d;margin:0 0 12px">{{ heading }}</h1>
      <p style="font-size:15px;color:#767c88;margin:0 0 30px">{{ altPrefix }} <a href="{{ altHref }}" style="font-weight:700">{{ altLabel }}</a></p>
      <button type="button" class="g-btn" onClick="{{ onGoogle }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:15px 18px;border-radius:12px;border:1px solid #d8d6cd;background:#fff;font-size:15px;font-weight:700;color:#181a1d;cursor:pointer;transition:background .15s,border-color .15s">
        <svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
        {{ googleLabel }}
      </button>
      <div style="display:flex;align-items:center;gap:16px;margin:24px 0">
        <span style="flex:1;height:1px;background:#d8d6cd"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.2em;color:#d81f2a;text-transform:uppercase;white-space:nowrap">{{ dividerText }}</span>
        <span style="flex:1;height:1px;background:#d8d6cd"></span>
      </div>
      <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:18px">
        <div style="{{ nameStyle }}">
          <label style="display:block;font-size:14px;font-weight:700;color:#181a1d;margin-bottom:9px">Nome</label>
          <input class="fld" name="nome" type="text" placeholder="Seu nome" style="width:100%;padding:15px 16px;border-radius:12px;border:1px solid #d8d6cd;background:#fff;font-size:15px;color:#181a1d;transition:border-color .15s,box-shadow .15s">
        </div>
        <div>
          <label style="display:block;font-size:14px;font-weight:700;color:#181a1d;margin-bottom:9px">E-mail</label>
          <input class="fld" name="email" type="email" required="" placeholder="voce@empresa.com" style="width:100%;padding:15px 16px;border-radius:12px;border:1px solid #d8d6cd;background:#fff;font-size:15px;color:#181a1d;transition:border-color .15s,box-shadow .15s">
        </div>
        <div>
          <label style="display:block;font-size:14px;font-weight:700;color:#181a1d;margin-bottom:9px">Senha</label>
          <div style="position:relative;display:flex;align-items:center">
            <input class="fld" name="senha" type="{{ pwType }}" required="" minlength="8" placeholder="Mínimo 8 caracteres" style="width:100%;padding:15px 74px 15px 16px;border-radius:12px;border:1px solid #d8d6cd;background:#fff;font-size:15px;color:#181a1d;transition:border-color .15s,box-shadow .15s">
            <button type="button" onClick="{{ togglePw }}" style="position:absolute;right:14px;background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:13px;color:#767c88;cursor:pointer;padding:4px">{{ pwLabel }}</button>
          </div>
        </div>
        <label style="display:flex;align-items:flex-start;gap:11px;font-size:13.5px;line-height:1.5;color:#5b616c;cursor:pointer;margin-top:2px;{{ termsStyle }}">
          <input type="checkbox" name="terms" style="margin-top:2px;width:17px;height:17px;accent-color:#d81f2a;flex-shrink:0">
          <span>Concordo com os <a href="#" style="font-weight:600">Termos de Uso</a> e a <a href="#" style="font-weight:600">Política de Privacidade</a>.</span>
        </label>
        <button type="submit" class="sub-btn" style="width:100%;margin-top:6px;padding:16px;border:none;border-radius:12px;background:#d81f2a;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 12px 30px -12px rgba(216,31,42,.7);transition:background .15s">{{ ctaLabel }}</button>
      </form>

      <div style="margin-top:16px;font-size:13.5px;line-height:1.5;{{ noticeStyle }}">{{ noticeText }}</div>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  /* ═══════════════════════════════════════════════════════════════
     CONFIG · conectar ao banco depois é só preencher aqui.
     - SIGNUP_ENDPOINT / LOGIN_ENDPOINT: rotas POST do backend.
       Recebem JSON e devem responder 2xx em caso de sucesso.
       Enquanto vazios, o fluxo segue em modo demonstração
       (vai direto para DASHBOARD_URL, sem gravar nada).
     - GOOGLE_CLIENT_ID: OAuth Web (console.cloud.google.com).
     - DASHBOARD_URL: para onde redirecionar após autenticar.
       Troque por "https://app.aperia.io" (ou a rota real) quando
       o dashboard estiver publicado.
     ═══════════════════════════════════════════════════════════════ */
  CONFIG = {
    SIGNUP_ENDPOINT: '',
    LOGIN_ENDPOINT:  '',
    GOOGLE_CLIENT_ID: '',
    GOOGLE_REDIRECT_URI: location.origin + '/auth/google/callback',
    DASHBOARD_URL: 'dash/index.html'
  };

  state = { active: 0, showPw: false, notice: '', noticeKind: '', busy: false };

  STEPS = [
    { intro: 'Bem-vindo ao aperIA' },
    { screen: 'home', label: 'Postura de Segurança' },
    { screen: 'findings', label: 'Findings' },
    { screen: 'attack', label: 'AI Insights' },
    { screen: 'remediations', label: 'Remediações' },
  ];

  isLogin(){ try { return new URLSearchParams(location.search).get('mode') === 'login'; } catch(e){ return false; } }

  componentDidMount(){
    // pre-preenche o e-mail vindo do CTA da landing (?email=...)
    try{
      const em=new URLSearchParams(location.search).get('email');
      if(em){ setTimeout(()=>{ const i=document.querySelector('input[name="email"]'); if(i&&!i.value) i.value=em; },120); }
    }catch(e){}
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    // carrossel: a intro ("Bem-vindo ao aperIA") fica 1.8s; os cards, 4.6s cada.
    // Timeout encadeado com espelho local do step (nao depende do timing do setState);
    // o tick respeita a flag _paused (hover).
    this._pos = 0;
    const tick = () => {
      const step = this.STEPS[this._pos];
      const delay = (step && !step.screen) ? 1800 : 4600;
      this._iv = setTimeout(() => {
        if(!this._paused){ this._pos = (this._pos + 1) % this.STEPS.length; this.setState({ active: this._pos }); }
        tick();
      }, delay);
    };
    tick();
  }
  componentWillUnmount(){ clearTimeout(this._iv); if(this._appFit) window.removeEventListener('resize', this._appFit); if(this._asideEl){ this._asideEl.removeEventListener('mouseenter', this._pause); this._asideEl.removeEventListener('mouseleave', this._resume); } }

  // TAREFA 6 · pausa/retoma no hover via addEventListener (nativo) num ref — evita atributos
  // on* que o runtime do DC nao reconhece e que quebravam a hidratacao do componente.
  _pause = () => { this._paused = true; };
  _resume = () => { this._paused = false; };
  asideRef = (el) => {
    if(!el || this._asideEl === el) return;
    this._asideEl = el;
    el.addEventListener('mouseenter', this._pause);
    el.addEventListener('mouseleave', this._resume);
  };

  appRef = (el) => {
    if(!el || this._appEl === el) return;
    this._appEl = el;
    const APPW = 1500;
    const fit = () => {
      const win = el.parentElement;
      if(!win) return;
      const w = win.clientWidth, h = win.clientHeight;
      if(!w || !h) return;
      const scale = w / APPW;
      el.style.width = APPW + 'px';
      el.style.height = Math.ceil(h / scale) + 'px';
      el.style.transform = 'scale(' + scale + ')';
    };
    fit(); this._appFit = fit;
    window.addEventListener('resize', fit);
    el.addEventListener('load', () => {
      fit();
      try {
        const w = el.contentWindow;
        const needTheme = w.localStorage.getItem('aperia-theme') !== 'light';
        const needConn = w.localStorage.getItem('aperia-connected') !== 'true';
        if(needTheme || needConn){
          w.localStorage.setItem('aperia-theme', 'light');
          w.localStorage.setItem('aperia-connected', 'true');
          w.location.reload();
          return;
        }
        this._appReady = true;
        this._navApp();
      } catch(e){}
    });
  };

  _navApp(){
    if(!this._appEl) return;
    const step = this.STEPS[this.state.active];
    if(!step || !step.screen) return;
    try {
      const w = this._appEl.contentWindow, d = w.document;
      const item = d.querySelector('.sb-item[data-screen="' + step.screen + '"]');
      if(item){ item.click(); }
      else if(typeof w.navigate === 'function'){ w.navigate(step.screen); }
      try { w.scrollTo(0, 0); d.documentElement.scrollTop = 0; d.body.scrollTop = 0; } catch(e){}
    } catch(e){}
  }

  componentDidUpdate(prevProps, prevState){ if(!prevState || prevState.active !== this.state.active) this._navApp(); }

  // ── autenticação (fácil de plugar no banco depois) ──
  _emailOk(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  _goDashboard(){
    if(this.CONFIG.DASHBOARD_URL) window.location.href = this.CONFIG.DASHBOARD_URL;
    else this.setState({ notice: 'Autenticado! Dashboard em desenvolvimento — configure DASHBOARD_URL.', noticeKind: 'ok' });
  }

  _submit = (e) => {
    e.preventDefault();
    if(this.state.busy) return;
    const login = this.isLogin();
    const f = e.target;
    const email = (f.querySelector('input[name=email]') || {}).value ? f.querySelector('input[name=email]').value.trim() : '';
    const senha = (f.querySelector('input[name=senha]') || {}).value || '';
    const nomeEl = f.querySelector('input[name=nome]');
    const nome = nomeEl ? nomeEl.value.trim() : '';
    const termsEl = f.querySelector('input[name=terms]');

    if(!this._emailOk(email)) return this.setState({ notice: 'Informe um e-mail válido.', noticeKind: 'err' });
    if(senha.length < 8) return this.setState({ notice: 'A senha precisa de pelo menos 8 caracteres.', noticeKind: 'err' });
    if(!login && (!nome || nome.length < 2)) return this.setState({ notice: 'Informe seu nome.', noticeKind: 'err' });
    if(!login && termsEl && !termsEl.checked) return this.setState({ notice: 'Aceite os Termos de Uso para continuar.', noticeKind: 'err' });

    const endpoint = login ? this.CONFIG.LOGIN_ENDPOINT : this.CONFIG.SIGNUP_ENDPOINT;
    const payload = login ? { email, senha } : { nome, email, senha };

    // Sem backend configurado → demonstração: segue direto ao dashboard.
    if(!endpoint){ this._goDashboard(); return; }

    this.setState({ busy: true, notice: '' });
    fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(payload) })
      .then(r => { if(r.ok) this._goDashboard(); else { this.setState({ busy: false, notice: login ? 'E-mail ou senha inválidos.' : 'Não foi possível criar a conta.', noticeKind: 'err' }); } })
      .catch(() => this.setState({ busy: false, notice: 'Falha de conexão. Tente novamente.', noticeKind: 'err' }));
  };

  _google = () => {
    const c = this.CONFIG;
    if(!c.GOOGLE_CLIENT_ID){ this.setState({ notice: 'Login com Google pronto na interface — configure GOOGLE_CLIENT_ID para ativar.', noticeKind: 'info' }); return; }
    const params = new URLSearchParams({ client_id: c.GOOGLE_CLIENT_ID, redirect_uri: c.GOOGLE_REDIRECT_URI, response_type: 'code', scope: 'openid email profile', access_type: 'offline', prompt: 'select_account' });
    window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
  };

  renderVals(){
    const a = this.state.active;
    const step = this.STEPS[a] || {};
    const intro = !step.screen;
    const login = this.isLogin();
    const dots = this.STEPS.map((s, i) => ({
      style: 'height:7px;border-radius:999px;transition:all .4s;' + (a === i ? 'width:22px;background:#d81f2a' : 'width:7px;background:#c4c9d0')
    }));
    const noticeColor = this.state.noticeKind === 'ok' ? '#177a52' : (this.state.noticeKind === 'info' ? '#2b6cb0' : '#b3232c');
    return {
      appRef: this.appRef,
      winStyle: intro ? 'opacity:0;transform:scale(.97);pointer-events:none' : 'opacity:1;transform:none',
      introOn: intro ? 'opacity:1' : 'opacity:0',
      introText: step.intro || 'Bem-vindo ao aperIA',
      dots,
      pwType: this.state.showPw ? 'text' : 'password',
      pwLabel: this.state.showPw ? 'ocultar' : 'mostrar',
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
      // ── textos/estados por modo (cadastro x login) ──
      heading: login ? 'Entrar' : 'Criar conta',
      altPrefix: login ? 'Ainda não tem conta?' : 'Já tem uma conta?',
      altLabel: login ? 'Criar conta' : 'Entrar',
      altHref: login ? 'cadastro.html' : 'cadastro.html?mode=login',
      googleLabel: login ? 'Entrar com Google' : 'Continuar com Google',
      dividerText: login ? 'ou entre com e-mail' : 'ou cadastre-se com e-mail',
      ctaLabel: this.state.busy ? 'Aguarde…' : (login ? 'Entrar' : 'Criar conta'),
      nameStyle: login ? 'display:none' : '',
      termsStyle: login ? 'display:none' : '',
      noticeStyle: this.state.notice ? ('color:' + noticeColor) : 'display:none',
      noticeText: this.state.notice,
      onSubmit: this._submit,
      onGoogle: this._google,
      asideRef: this.asideRef,
    };
  }
}
</script>
</body>
</html>
